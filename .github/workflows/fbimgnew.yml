name: Generate Quiz Image for Facebook

on:
  workflow_dispatch:
    inputs:
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D'
        required: false
        type: string
        default: ''
      e:
        description: 'Extra box text (yellow)'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string
      brand:
        description: 'Brand / username watermark'
        required: false
        type: string
        default: 'perime.rw250'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_E: ${{ github.event.inputs.e }}
          INPUT_X: ${{ github.event.inputs.x }}
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs');
            const path = require('path');
            const sharp = require('sharp');

            // ─────────────────── CONFIGURATION ───────────────────
            const OUT_DIR = 'perimelight/outputfbimg';
            const SIGNS_DIR = 'perimelight/signs';
            const OVERLAY_PATH = path.join('perimelight', 'overlay', 'rise.jpg');

            // Font multipliers (relative to content area width)
            const qFontMultiplier = 0.05;
            const oFontMultiplier = 0.047;
            const extraFontMultiplier = 0.04;

            const qLineHeightMultiplier = 1.2;
            const oLineHeightMultiplier = 1.15;
            const extraLineHeightMultiplier = 1.25;

            const showTitleText = false;
            const prependQuestionNumber = true;

            const optionBoxHeight = 72;
            const optionSpacing = 16;
            const circleRadius = 22;
            const circleFontSize = 20;

            const TOP_OFFSET = 60;
            const BOTTOM_MARGIN = 40;

            // === FONT SIZE LIMITS (Readability Hard Bounds) ===
            const MIN_QUESTION_FONT = 24;    // Never go below this
            const MAX_QUESTION_FONT = 60;    // Never go above this
            const MIN_OPTION_FONT = 20;      // Never go below this
            const MAX_OPTION_FONT = 52;      // Never go above this
            const MIN_EXTRA_FONT = 18;       // Never go below this
            const MAX_EXTRA_FONT = 48;       // Never go above this

            // Extra (yellow) box positioning relative to overlay dimensions
            const CONTENT_LEFT_RATIO = 0.155;
            const CONTENT_RIGHT_RATIO = 0.835;
            const EXTRA_BOTTOM_RATIO = 0.821;
            const EXTRA_MIN_GAP = 16;
            const extraBoxFill = "#FFF9C4";
            const extraBoxStroke = "black";
            const extraBoxStrokeWidth = 1;
            // ──────────────────────────────────────────────────────

            // Utility: escape XML special characters
            function escapeXml(s) {
              return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
            }

            // Character‑width table for approximate SVG text measurement
            const charWidth = (ch) => {
              if (/[iIl1|!.,;:'`"()\[\]{}\\\/]/.test(ch)) return 0.34;
              if (/[mwMW@%]/.test(ch)) return 0.72;
              if (/[A-Z]/.test(ch)) return 0.66;
              if (/[a-z]/.test(ch)) return 0.52;
              if (/[0-9]/.test(ch)) return 0.58;
              return 0.56;
            };

            const textWidth = (s, fontSize) =>
              [...String(s)].reduce((sum, c) => sum + charWidth(c) * fontSize, 0);

            // Word‑wrap a string so each line fits within maxWidth
            const wrapText = (text, maxWidth, fontSize) => {
              const words = String(text).trim().split(/\s+/);
              const lines = [];
              let currentLine = '';
              for (const word of words) {
                const testLine = currentLine ? currentLine + ' ' + word : word;
                if (textWidth(testLine, fontSize) <= maxWidth) {
                  currentLine = testLine;
                  continue;
                }
                if (currentLine) lines.push(currentLine);
                // If a single word is too long, split it character by character
                if (textWidth(word, fontSize) > maxWidth) {
                  let part = '';
                  for (const ch of word) {
                    if (textWidth(part + ch, fontSize) <= maxWidth) {
                      part += ch;
                    } else {
                      lines.push(part);
                      part = ch;
                    }
                  }
                  currentLine = part;
                } else {
                  currentLine = word;
                }
              }
              if (currentLine) lines.push(currentLine);
              return lines;
            };

            // Clean option text by removing possible labels like "A.", "A)" etc.
            const cleanOption = (text, key) => {
              text = String(text);
              const prefixPattern = new RegExp(`^${String(key)}\\s*[\\.\\)\\-\\:\\s]+`, 'i');
              const cleaned = prefixPattern.test(text) ? text.replace(prefixPattern, '').trim() : text.trim();
              if (cleaned.length > 0) {
                return cleaned[0].toUpperCase() + cleaned.slice(1);
              }
              return cleaned;
            };

            // ─────────────────── LOAD OVERLAY ──────────────────
            if (!fs.existsSync(OVERLAY_PATH)) {
              throw new Error(`Missing overlay image: ${OVERLAY_PATH}`);
            }
            const base = sharp(OVERLAY_PATH);
            const { width: W, height: H } = await base.metadata();

            // Safe area inside the overlay (the "whiteboard")
            const SAFE = {
              x: Math.round(W * 0.13),
              y: Math.round(H * 0.14),
              w: Math.round(W * 0.720),
              h: Math.round(H * 0.69),
            };

            const PAD = 24;
            const CARD_W = SAFE.w - PAD * 2;            // width of the answer card
            const MAX_AVAILABLE_H = SAFE.h - BOTTOM_MARGIN;

            // ─────────────────── PARSE INPUTS ─────────────────
            const qId = (process.env.INPUT_X || '1').trim();
            let qText = (process.env.INPUT_Q || '').replace(/\s+/g, ' ').trim();
            const rawOpts = {
              a: process.env.INPUT_A || '',
              b: process.env.INPUT_B || '',
              c: process.env.INPUT_C || '',
              d: process.env.INPUT_D || '',
            };
            const extraText = (process.env.INPUT_E || '').trim();
            const hasExtra = extraText.length > 0;

            // Check if an image is requested using the [image] tag
            const hasImageTag = /\[image\]/i.test(qText);
            if (hasImageTag) {
              qText = qText.replace(/\[image\]/i, '').trim();
            }

            // Load optional sign image
            let signBuf = null;
            let signW = 0;
            let signH = 0;
            if (hasImageTag) {
              for (const ext of ['.jpg', '.jpeg', '.png', '.webp']) {
                const imgPath = path.join(SIGNS_DIR, `${qId}${ext}`);
                if (fs.existsSync(imgPath)) {
                  signBuf = await sharp(imgPath)
                    .resize(Math.round(CARD_W * 0.85), Math.round(SAFE.h * 0.3), {
                      fit: 'inside',
                      withoutEnlargement: true,
                    })
                    .png()
                    .toBuffer();
                  const meta = await sharp(signBuf).metadata();
                  signW = meta.width;
                  signH = meta.height;
                  break;
                }
              }
            }

            // Process answer options (only those that are not empty)
            const options = ['a', 'b', 'c', 'd']
              .filter((k) => {
                const v = rawOpts[k];
                return v !== undefined && v !== null && String(v).trim() !== '';
              })
              .map((k) => ({
                key: k.toUpperCase(),
                text: cleanOption(rawOpts[k], k),
              }));

            if (options.length === 0) {
              throw new Error('At least one answer option is required.');
            }

            // ─────────── LAYOUT: FIND FONT SIZES WITH EQUAL PRIORITY ──────────────
            let qFont = Math.min(MAX_QUESTION_FONT, Math.round(CARD_W * qFontMultiplier));
            let oFont = Math.min(MAX_OPTION_FONT, Math.round(CARD_W * oFontMultiplier));
            let baseLayout = null;

            const displayText = prependQuestionNumber ? `Q${qId}: ${qText}` : qText;

            for (let attempt = 0; attempt < 35; attempt++) {
              const qLines = wrapText(displayText, CARD_W - 64, qFont);
              const qLineHeight = qFont * qLineHeightMultiplier;

              const optionData = options.map((opt) => {
                const lines = wrapText(opt.text, CARD_W - 140, oFont);
                const lineHeight = oFont * oLineHeightMultiplier;
                const neededH = Math.max(optionBoxHeight, lines.length * lineHeight + 28);
                return { ...opt, lines, lineHeight, boxH: neededH };
              });

              const titleH = showTitleText ? 70 : 20;
              const qH = qLines.length * qLineHeight + 24;
              const signBlock = signH ? signH + 24 : 0;
              const optionsTotalH =
                optionData.reduce((sum, o) => sum + o.boxH, 0) +
                (optionData.length - 1) * optionSpacing;

              const totalCardH = titleH + qH + signBlock + optionsTotalH + 48;

              if (totalCardH <= MAX_AVAILABLE_H) {
                baseLayout = {
                  qFont,
                  oFont,
                  qLines,
                  qLineHeight,
                  optionData,
                  titleH,
                  qH,
                  signBlock,
                  optionsTotalH,
                  totalCardH,
                };
                break;
              }

              // --- EQUAL PRIORITY REDUCTION ---
              const canReduceQ = qFont > MIN_QUESTION_FONT;
              const canReduceO = oFont > MIN_OPTION_FONT;
              
              if (!canReduceQ && !canReduceO) break;
              
              const qRoom = qFont - MIN_QUESTION_FONT;
              const oRoom = oFont - MIN_OPTION_FONT;
              
              if (qRoom > oRoom) {
                qFont = Math.max(MIN_QUESTION_FONT, qFont - 2);
              } else if (oRoom > qRoom) {
                oFont = Math.max(MIN_OPTION_FONT, oFont - 1);
              } else {
                if (attempt % 2 === 0 && canReduceQ) {
                  qFont = Math.max(MIN_QUESTION_FONT, qFont - 2);
                } else if (canReduceO) {
                  oFont = Math.max(MIN_OPTION_FONT, oFont - 1);
                } else if (canReduceQ) {
                  qFont = Math.max(MIN_QUESTION_FONT, qFont - 2);
                }
              }
            }

            // Final attempt at minimum sizes
            if (!baseLayout) {
              qFont = MIN_QUESTION_FONT;
              oFont = MIN_OPTION_FONT;
              
              const qLines = wrapText(displayText, CARD_W - 64, qFont);
              const qLineHeight = qFont * qLineHeightMultiplier;

              const optionData = options.map((opt) => {
                const lines = wrapText(opt.text, CARD_W - 140, oFont);
                const lineHeight = oFont * oLineHeightMultiplier;
                const neededH = Math.max(optionBoxHeight, lines.length * lineHeight + 28);
                return { ...opt, lines, lineHeight, boxH: neededH };
              });

              const titleH = showTitleText ? 70 : 20;
              const qH = qLines.length * qLineHeight + 24;
              const signBlock = signH ? signH + 24 : 0;
              const optionsTotalH =
                optionData.reduce((sum, o) => sum + o.boxH, 0) +
                (optionData.length - 1) * optionSpacing;

              const totalCardH = titleH + qH + signBlock + optionsTotalH + 48;

              if (totalCardH <= MAX_AVAILABLE_H) {
                baseLayout = {
                  qFont,
                  oFont,
                  qLines,
                  qLineHeight,
                  optionData,
                  titleH,
                  qH,
                  signBlock,
                  optionsTotalH,
                  totalCardH,
                };
              }
            }

            // Skip instead of crash
            if (!baseLayout) {
              console.warn(`⚠️ Question ${qId}: Content too long even at minimum readable sizes`);
              console.warn(`   Q:${MIN_QUESTION_FONT}px, O:${MIN_OPTION_FONT}px - Consider shortening text`);
              return;
            }

            // Card positioning inside the safe area
            const cardTop = SAFE.y + TOP_OFFSET;
            const cardLeft = Math.round(SAFE.x + (SAFE.w - CARD_W) / 2);
            const CARD_H = baseLayout.totalCardH;

            // Build SVG for the answer card
            const cardSvgParts = [];
            cardSvgParts.push(
              `<svg width="${CARD_W}" height="${CARD_H}" xmlns="http://www.w3.org/2000/svg">`
            );
            cardSvgParts.push(
              `<rect x="0" y="0" width="${CARD_W}" height="${CARD_H}" rx="26" fill="#FFFFFF00"/>`
            );

            let y = baseLayout.titleH + 8;

            // Title (if shown)
            if (showTitleText) {
              cardSvgParts.push(
                `<text x="32" y="48" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1565C0">Ikibazo cya ${escapeXml(qId)}</text>`
              );
            }

            // Question text
            baseLayout.qLines.forEach((line, idx) => {
              cardSvgParts.push(
                `<text x="32" y="${y + idx * baseLayout.qLineHeight}" font-family="Arial,Helvetica,sans-serif" font-size="${baseLayout.qFont}" font-weight="700" fill="#1E1E1E">${escapeXml(line)}</text>`
              );
            });

            y += baseLayout.qH + baseLayout.signBlock;

            // Option boxes
            baseLayout.optionData.forEach((opt) => {
              cardSvgParts.push(
                `<rect x="24" y="${y}" width="${CARD_W - 48}" height="${opt.boxH}" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>`
              );
              cardSvgParts.push(
                `<circle cx="60" cy="${y + opt.boxH / 2}" r="${circleRadius}" fill="#E3F2FD"/>`
              );
              cardSvgParts.push(
                `<text x="60" y="${y + opt.boxH / 2 + 7}" font-family="Arial Black,Arial,sans-serif" font-size="${circleFontSize}" font-weight="900" fill="#1565C0" text-anchor="middle">${opt.key}</text>`
              );
              const textStartY = y + (opt.boxH - opt.lines.length * opt.lineHeight) / 2;
              opt.lines.forEach((line, li) => {
                cardSvgParts.push(
                  `<text x="100" y="${textStartY + opt.lineHeight * 0.8 + li * opt.lineHeight}" font-family="Arial,Helvetica,sans-serif" font-size="${baseLayout.oFont}" fill="#212121">${escapeXml(line)}</text>`
                );
              });
              y += opt.boxH + optionSpacing;
            });

            cardSvgParts.push(`</svg>`);
            const cardSvg = cardSvgParts.join('\n');
            const cardBuf = await sharp(Buffer.from(cardSvg)).png().toBuffer();

            // ─────────── COMPOSITE ON OVERLAY ─────────────────
            const composites = [
              { input: cardBuf, left: cardLeft, top: cardTop },
            ];

            // Add the sign image if present
            if (signBuf) {
              const signTop = Math.round(cardTop + baseLayout.titleH + baseLayout.qH + 12);
              const signLeft = Math.round(cardLeft + (CARD_W - signW) / 2);
              composites.push({ input: signBuf, left: signLeft, top: signTop });
            }

            // Extra (yellow) box if provided and space allows
            if (hasExtra) {
              const CONTENT_LEFT = Math.round(W * CONTENT_LEFT_RATIO);
              const CONTENT_RIGHT = Math.round(W * CONTENT_RIGHT_RATIO);
              const CONTENT_W = CONTENT_RIGHT - CONTENT_LEFT;
              const EXTRA_BOTTOM = Math.round(H * EXTRA_BOTTOM_RATIO);
              const lastOptionBottom = cardTop + baseLayout.titleH + baseLayout.qH + baseLayout.signBlock + baseLayout.optionsTotalH;
              const maxExtraH = Math.max(0, EXTRA_BOTTOM - lastOptionBottom - EXTRA_MIN_GAP);

              if (maxExtraH > 48) {
                let eFont = Math.min(MAX_EXTRA_FONT, Math.round(CONTENT_W * extraFontMultiplier));
                let extraData = null;

                for (let attempt = 0; attempt < 15; attempt++) {
                  const lines = wrapText(extraText, CONTENT_W - 48, eFont);
                  const lineHeight = eFont * extraLineHeightMultiplier;
                  const boxH = Math.max(56, lines.length * lineHeight + 24);

                  if (boxH <= maxExtraH || eFont <= MIN_EXTRA_FONT) {
                    extraData = { lines, lineHeight, boxH, font: eFont };
                    break;
                  }
                  eFont = Math.max(MIN_EXTRA_FONT, eFont - 1);
                }

                if (extraData) {
                  const eTop = Math.round(EXTRA_BOTTOM - extraData.boxH);
                  const extraSvgParts = [];
                  extraSvgParts.push(
                    `<svg width="${CONTENT_W}" height="${extraData.boxH}" xmlns="http://www.w3.org/2000/svg">`
                  );
                  extraSvgParts.push(
                    `<rect x="0" y="0" width="${CONTENT_W}" height="${extraData.boxH}" fill="${extraBoxFill}" stroke="${extraBoxStroke}" stroke-width="${extraBoxStrokeWidth}"/>`
                  );
                  const textStartY =
                    (extraData.boxH - extraData.lines.length * extraData.lineHeight) / 2;
                  extraData.lines.forEach((line, idx) => {
                    extraSvgParts.push(
                      `<text x="24" y="${textStartY + extraData.lineHeight * 0.8 + idx * extraData.lineHeight}" font-family="Arial,Helvetica,sans-serif" font-size="${extraData.font}" font-weight="700" fill="#000000">${escapeXml(line)}</text>`
                    );
                  });
                  extraSvgParts.push(`</svg>`);
                  const eBuf = await sharp(Buffer.from(extraSvgParts.join('\n'))).png().toBuffer();
                  composites.push({ input: eBuf, left: CONTENT_LEFT, top: eTop });
                }
              }
            }

            // Render final image
            const safeId = qId.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);
            fs.mkdirSync(OUT_DIR, { recursive: true });
            await base.composite(composites).png({ compressionLevel: 9 }).toFile(outFile);
            console.log('Generated:', outFile);
          })();
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image Q${{ github.event.inputs.x }}" && git push)
