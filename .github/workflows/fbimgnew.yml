name: Generate Quiz Image for Facebook

on:
  workflow_dispatch:
    inputs:
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D'
        required: false
        type: string
        default: ''
      e:
        description: 'Extra box text (yellow)'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string
      brand:
        description: 'Brand / username watermark'
        required: false
        type: string
        default: 'perime.rw250'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_E: ${{ github.event.inputs.e }}
          INPUT_X: ${{ github.event.inputs.x }}
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'), path = require('path'), sharp = require('sharp');

            // ================================================================
            // ====================== CONFIGURATION ============================
            // ================================================================
            
            // ─── FILE & DIRECTORY PATHS ─────────────────────────────────────
            const CONFIG = {
              OUT_DIR: 'perimelight/outputfbimg',
              SIGNS_DIR: 'perimelight/signs',
              OVERLAY_PATH: path.join('perimelight', 'overlay', 'new.png'),
              SIGN_EXTENSIONS: ['.jpg', '.jpeg', '.png', '.webp']
            };
            
            // ─── SAFE ZONE & LAYOUT ─────────────────────────────────────────
            const LAYOUT = {
              // Safe zone percentages
              safeZone: { x: 0.13, y: 0.15, w: 0.720, h: 0.713 },
              cardPadding: 24,
              topOffset: 50,          // card top = safeZone.y + topOffset
              bottomMargin: 40        // minimum space below card inside safe zone
            };
            
            // ─── BOTTOM BORDER LINE ─────────────────────────────────────────
            const BORDER = {
              enabled: true,
              yPosition: 480,          // fixed Y coordinate from card top
              color: '#1565C0',
              width: 4,
              opacity: 0.8
            };
            
            // ─── TEXT STYLING ──────────────────────────────────────────────
            const TEXT = {
              question: {
                fontMultiplier: 0.05,
                lineHeight: 1.2,
                color: '#1E1E1E',
                fontWeight: 700,
                family: 'Arial,Helvetica,sans-serif',
                paddingX: 64,
                paddingY: 24
              },
              option: {
                fontMultiplier: 0.047,
                lineHeight: 1.15,
                color: '#212121',
                fontWeight: 400,
                family: 'Arial,Helvetica,sans-serif',
                paddingX: 140
              },
              extra: {
                fontMultiplier: 0.045,
                lineHeight: 1.25,
                color: '#000000',
                fontWeight: 'bold',
                family: 'Arial,Helvetica,sans-serif',
                paddingX: 80,
                paddingY: 28
              },
              title: {
                show: false,
                prependQuestionNumber: true,
                height: 70,
                fontSize: 26,
                fontWeight: 700,
                color: '#1565C0',
                family: 'Arial,Helvetica,sans-serif',
                text: 'Ikibazo cya '
              }
            };
            
            // ─── OPTION BOXES ──────────────────────────────────────────────
            const OPTION = {
              height: 72,
              spacing: 16,
              borderRadius: 16,
              background: '#FFFFFF',
              stroke: '#E0E0E0',
              strokeWidth: 1.5,
              circle: {
                radius: 22,
                fill: '#E3F2FD',
                textColor: '#1565C0',
                fontSize: 20,
                fontFamily: 'Arial Black,Arial,sans-serif',
                fontWeight: 900
              }
            };
            
            // ─── EXTRA BOX (YELLOW) ────────────────────────────────────────
            const EXTRA = {
              fill: '#FFF9C4',
              stroke: '#000000',
              strokeWidth: 1,
              borderRadius: 16,
              maxWidthPadding: 48,    // padding from card edges
              gap: 16,                // gap between options and extra box
              minHeight: 72
            };
            
            // ─── IMAGE HANDLING ─────────────────────────────────────────────
            const IMAGE = {
              tag: '[image]',
              maxWidthPercent: 0.85,
              maxHeightPercent: 0.30,
              marginBottom: 24,
              fit: 'inside',
              withoutEnlargement: true
            };
            
            // ─── FONT FITTING ──────────────────────────────────────────────
            const FITTING = {
              maxIterations: 100,     // increased for better chance
              minQuestionFont: 20,
              minOptionFont: 16,
              reductionStep: 1
            };
            
            // ─── CARD STYLING ──────────────────────────────────────────────
            const CARD = {
              borderRadius: 26,
              background: '#FFFFFF00',
              stroke: '#FFFFFF00',
              strokeWidth: 2,
              bottomPadding: 48
            };
            
            // ================================================================
            // ==================== END CONFIGURATION =========================
            // ================================================================

            // ── INITIALIZATION ──────────────────────────────────────────────
            fs.mkdirSync(CONFIG.OUT_DIR, { recursive: true });

            if (!fs.existsSync(CONFIG.OVERLAY_PATH)) {
              throw new Error(`Missing overlay image: ${CONFIG.OVERLAY_PATH}`);
            }
            
            const base = sharp(CONFIG.OVERLAY_PATH);
            const { width: W, height: H } = await base.metadata();

            // ── SAFE ZONE ────────────────────────────────────────────────────
            const SAFE = {
              x: Math.round(W * LAYOUT.safeZone.x),
              y: Math.round(H * LAYOUT.safeZone.y),
              w: Math.round(W * LAYOUT.safeZone.w),
              h: Math.round(H * LAYOUT.safeZone.h)
            };
            
            const CARD_W = SAFE.w - LAYOUT.cardPadding * 2;
            const MAX_AVAILABLE_H = SAFE.h - LAYOUT.bottomMargin;

            // ── INPUTS ──────────────────────────────────────────────────────
            const qId = (process.env.INPUT_X || '1').trim();
            let qText = (process.env.INPUT_Q || '').replace(/\s+/g, ' ').trim();
            
            const rawOpts = {
              a: (process.env.INPUT_A || '').trim(),
              b: (process.env.INPUT_B || '').trim(),
              c: (process.env.INPUT_C || '').trim(),
              d: (process.env.INPUT_D || '').trim()
            };
            
            const extraText = (process.env.INPUT_E || '').trim();
            const hasExtraText = extraText.length > 0;

            // ── OPTIONAL SIGN IMAGE ────────────────────────────────────────
            const hasImg = new RegExp(IMAGE.tag, 'i').test(qText);
            if (hasImg) qText = qText.replace(new RegExp(IMAGE.tag, 'i'), '').trim();
            
            let signBuf = null, signH = 0, signW = 0;
            if (hasImg) {
              for (const ext of CONFIG.SIGN_EXTENSIONS) {
                const p = path.join(CONFIG.SIGNS_DIR, `${qId}${ext}`);
                if (!fs.existsSync(p)) continue;
                try {
                  signBuf = await sharp(p)
                    .resize(
                      Math.round(CARD_W * IMAGE.maxWidthPercent),
                      Math.round(SAFE.h * IMAGE.maxHeightPercent),
                      { fit: IMAGE.fit, withoutEnlargement: IMAGE.withoutEnlargement }
                    )
                    .png()
                    .toBuffer();
                  const m = await sharp(signBuf).metadata();
                  signW = m.width;
                  signH = m.height;
                } catch (e) {
                  console.warn('Image processing failed:', e.message);
                  signBuf = null;
                }
                break;
              }
            }

            // ── OPTIONS CLEANING ──────────────────────────────────────────
            const cleanOptionText = (text, optionKey) => {
              const pattern = new RegExp(`^${optionKey.toLowerCase()}\\s*[\\.\\)\\-\\:\\s]+`, 'i');
              if (pattern.test(text)) return text.replace(pattern, '').trim();
              const simplePattern = new RegExp(`^${optionKey.toLowerCase()}\\s+`, 'i');
              if (simplePattern.test(text)) return text.replace(simplePattern, '').trim();
              if (text.toLowerCase() === optionKey.toLowerCase()) return '';
              return text;
            };

            const opts = ['a','b','c','d']
              .filter(k => rawOpts[k] && rawOpts[k].length > 0)
              .map(k => {
                let text = rawOpts[k];
                let cleanText = cleanOptionText(text, k);
                if (!cleanText || cleanText.length === 0) cleanText = text;
                cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
                return { k: k.toUpperCase(), t: cleanText };
              });

            // ── TEXT HELPERS ──────────────────────────────────────────────
            const cw = ch => /[iIl1|!.,;:'`"()\[\]{}\\\/]/.test(ch) ? 0.34 :
                            /[mwMW@%]/.test(ch) ? 0.72 :
                            /[A-Z]/.test(ch) ? 0.66 :
                            /[a-z]/.test(ch) ? 0.52 :
                            /[0-9]/.test(ch) ? 0.58 : 0.56;
            const textW = (s, fs) => [...String(s)].reduce((a, c) => a + cw(c) * fs, 0);
            const wrap = (t, maxW, fs) => {
              const words = String(t).trim().split(/\s+/);
              const lines = [];
              let current = '';
              for (const word of words) {
                const test = current ? current + ' ' + word : word;
                if (textW(test, fs) <= maxW) {
                  current = test;
                  continue;
                }
                if (current) lines.push(current);
                if (textW(word, fs) > maxW) {
                  let partial = '';
                  for (const ch of word) {
                    if (textW(partial + ch, fs) <= maxW) partial += ch;
                    else { if (partial) lines.push(partial); partial = ch; }
                  }
                  current = partial;
                } else {
                  current = word;
                }
              }
              if (current) lines.push(current);
              return lines.length ? lines : [''];
            };

            // ── QUESTION TEXT ─────────────────────────────────────────────
            let displayText = qText || 'Question';
            if (TEXT.title.prependQuestionNumber) {
              displayText = `Q${qId}: ${displayText}`;
            }

            // ── 1. LAYOUT CALCULATION ──────────────────────────────────────
            let qFont = Math.round(CARD_W * TEXT.question.fontMultiplier);
            let oFont = Math.round(CARD_W * TEXT.option.fontMultiplier);
            let extraFont = Math.round(CARD_W * TEXT.extra.fontMultiplier);
            
            let bestLayout = null;
            let bestHeight = Infinity;
            
            // Try to find a fitting layout with font reduction
            for (let attempt = 0; attempt < FITTING.maxIterations; attempt++) {
              const qLines = wrap(displayText, CARD_W - TEXT.question.paddingX, qFont);
              const qLH = qFont * TEXT.question.lineHeight;
              const qH = qLines.length * qLH + TEXT.question.paddingY;
              
              const oData = opts.map(o => {
                const ls = wrap(o.t, CARD_W - TEXT.option.paddingX, oFont);
                const lh = oFont * TEXT.option.lineHeight;
                const h = Math.max(OPTION.height, ls.length * lh + 28);
                return { ...o, ls, lh, h };
              });
              
              let extraData = null;
              if (hasExtraText) {
                const maxW = CARD_W - EXTRA.maxWidthPadding;
                const extraLines = wrap(extraText, maxW, extraFont);
                const extraLH = extraFont * TEXT.extra.lineHeight;
                const extraH = Math.max(EXTRA.minHeight, extraLines.length * extraLH + TEXT.extra.paddingY);
                extraData = { lines: extraLines, lh: extraLH, h: extraH, font: extraFont };
              }
              
              const titleH = TEXT.title.show ? TEXT.title.height : 20;
              const signBlock = signH ? signH + IMAGE.marginBottom : 0;
              const optsH = oData.reduce((s, o) => s + o.h, 0) + (oData.length - 1) * OPTION.spacing;
              
              // Calculate total height from top to bottom
              let totalHeight = titleH + qH + signBlock + optsH + CARD.bottomPadding;
              if (hasExtraText && extraData) {
                totalHeight += EXTRA.gap + extraData.h;
              }
              
              if (totalHeight <= MAX_AVAILABLE_H && totalHeight < bestHeight) {
                bestHeight = totalHeight;
                bestLayout = {
                  qFont, oFont, extraFont,
                  qLines, qLH, qH,
                  oData, optsH,
                  extraData,
                  titleH,
                  signBlock,
                  totalHeight
                };
              }
              
              // Reduce fonts for next iteration
              let reduced = false;
              if (qFont > FITTING.minQuestionFont && attempt % 2 === 0) {
                qFont = Math.max(qFont - FITTING.reductionStep, FITTING.minQuestionFont);
                reduced = true;
              }
              if (oFont > FITTING.minOptionFont && (attempt % 3 === 0 || !reduced)) {
                oFont = Math.max(oFont - FITTING.reductionStep, FITTING.minOptionFont);
                reduced = true;
              }
              if (hasExtraText && extraFont > FITTING.minQuestionFont && (attempt % 4 === 0 || !reduced)) {
                extraFont = Math.max(extraFont - FITTING.reductionStep, FITTING.minQuestionFont);
                reduced = true;
              }
              if (!reduced) break;
            }
            
            // Fallback: if still no fit, force minimal layout
            if (!bestLayout) {
              console.warn('Content too long; forcing minimal layout with reduced text.');
              // Use minimum fonts and truncate if needed
              const qLines = wrap(displayText.substring(0, 120), CARD_W - TEXT.question.paddingX, FITTING.minQuestionFont);
              const qLH = FITTING.minQuestionFont * TEXT.question.lineHeight;
              const qH = Math.min(qLines.length * qLH + TEXT.question.paddingY, MAX_AVAILABLE_H * 0.3);
              
              const oData = opts.slice(0, 2).map(o => ({
                ...o,
                ls: wrap(o.t.substring(0, 60), CARD_W - TEXT.option.paddingX, FITTING.minOptionFont),
                lh: FITTING.minOptionFont * TEXT.option.lineHeight,
                h: Math.max(OPTION.height, 50)
              }));
              
              bestLayout = {
                qFont: FITTING.minQuestionFont,
                oFont: FITTING.minOptionFont,
                extraFont: hasExtraText ? FITTING.minQuestionFont : FITTING.minOptionFont,
                qLines,
                qLH,
                qH,
                oData,
                optsH: oData.reduce((s, o) => s + o.h, 0) + (oData.length - 1) * OPTION.spacing,
                extraData: hasExtraText ? {
                  lines: wrap(extraText.substring(0, 80), CARD_W - EXTRA.maxWidthPadding, FITTING.minQuestionFont),
                  lh: FITTING.minQuestionFont * TEXT.extra.lineHeight,
                  h: EXTRA.minHeight,
                  font: FITTING.minQuestionFont
                } : null,
                titleH: 0,
                signBlock: 0,
                totalHeight: Math.min(MAX_AVAILABLE_H, 500)
              };
            }

            // ── 2. BUILD SVG ──────────────────────────────────────────────
            const CARD_H = Math.min(bestLayout.totalHeight, MAX_AVAILABLE_H);
            const cardTop = SAFE.y + LAYOUT.topOffset;
            const cardLeft = Math.round(SAFE.x + (SAFE.w - CARD_W) / 2);
            
            const C = [];
            C.push(`<svg width="${CARD_W}" height="${CARD_H}" xmlns="http://www.w3.org/2000/svg">`);
            C.push(`<rect x="0" y="0" width="${CARD_W}" height="${CARD_H}" rx="${CARD.borderRadius}" fill="${CARD.background}" stroke="${CARD.stroke}" stroke-width="${CARD.strokeWidth}"/>`);

            // ── BOTTOM BORDER LINE ────────────────────────────────────────
            if (BORDER.enabled) {
              const borderY = BORDER.yPosition;
              C.push(`<line x1="32" y1="${borderY}" x2="${CARD_W - 32}" y2="${borderY}" stroke="${BORDER.color}" stroke-width="${BORDER.width}" opacity="${BORDER.opacity}"/>`);
            }

            // ── DRAW FROM TOP TO BOTTOM ───────────────────────────────────
            let y = bestLayout.titleH + 8;
            
            // Question
            bestLayout.qLines.forEach((ln, i) => {
              C.push(`<text x="${TEXT.question.paddingX / 2}" y="${y + i * bestLayout.qLH}" font-family="${TEXT.question.family}" font-size="${bestLayout.qFont}" font-weight="${TEXT.question.fontWeight}" fill="${TEXT.question.color}">${escapeXml(ln)}</text>`);
            });
            y += bestLayout.qH;
            
            // Image
            if (signH) {
              y += IMAGE.marginBottom;
              // Image will be composited later
            }
            y += bestLayout.signBlock;
            
            // Options
            bestLayout.oData.forEach(o => {
              C.push(`<rect x="24" y="${y}" width="${CARD_W - 48}" height="${o.h}" rx="${OPTION.borderRadius}" fill="${OPTION.background}" stroke="${OPTION.stroke}" stroke-width="${OPTION.strokeWidth}"/>`);
              C.push(`<circle cx="60" cy="${y + o.h / 2}" r="${OPTION.circle.radius}" fill="${OPTION.circle.fill}"/>`);
              C.push(`<text x="60" y="${y + o.h / 2 + 7}" font-family="${OPTION.circle.fontFamily}" font-size="${OPTION.circle.fontSize}" font-weight="${OPTION.circle.fontWeight}" fill="${OPTION.circle.textColor}" text-anchor="middle">${o.k}</text>`);
              o.ls.forEach((ln, li) => {
                const textY = y + (o.h - o.ls.length * o.lh) / 2 + o.lh * 0.8 + li * o.lh;
                C.push(`<text x="100" y="${textY}" font-family="${TEXT.option.family}" font-size="${bestLayout.oFont}" fill="${TEXT.option.color}">${escapeXml(ln)}</text>`);
              });
              y += o.h + OPTION.spacing;
            });
            
            // Extra box (yellow) at bottom
            if (hasExtraText && bestLayout.extraData) {
              // Gap between options and extra
              y += EXTRA.gap - OPTION.spacing;
              const e = bestLayout.extraData;
              C.push(`<rect x="${EXTRA.maxWidthPadding / 2}" y="${y}" width="${CARD_W - EXTRA.maxWidthPadding}" height="${e.h}" rx="${EXTRA.borderRadius}" fill="${EXTRA.fill}" stroke="${EXTRA.stroke}" stroke-width="${EXTRA.strokeWidth}"/>`);
              e.lines.forEach((ln, li) => {
                const textY = y + (e.h - e.lines.length * e.lh) / 2 + e.lh * 0.8 + li * e.lh;
                C.push(`<text x="${EXTRA.maxWidthPadding}" y="${textY}" font-family="${TEXT.extra.family}" font-size="${e.font}" font-weight="${TEXT.extra.fontWeight}" fill="${TEXT.extra.color}">${escapeXml(ln)}</text>`);
              });
            }

            C.push(`</svg>`);

            // ── 3. COMPOSITE ──────────────────────────────────────────────
            const cardBuf = await sharp(Buffer.from(C.join('\n'))).png().toBuffer();
            
            const composites = [{ input: cardBuf, left: cardLeft, top: cardTop }];
            if (signBuf) {
              const signTop = Math.round(cardTop + bestLayout.titleH + bestLayout.qH + 12);
              const signLeft = Math.round(cardLeft + (CARD_W - signW) / 2);
              composites.push({ input: signBuf, left: signLeft, top: signTop });
            }

            const safeId = qId.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(CONFIG.OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);
            await base.composite(composites).png({ compressionLevel: 9 }).toFile(outFile);
            console.log('Generated:', outFile);
          })();

          function escapeXml(s) { 
            return String(s)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;'); 
          }
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image Q${{ github.event.inputs.x }}" && git push)
