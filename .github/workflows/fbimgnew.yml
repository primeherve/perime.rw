name: Generate Quiz Image for Facebook

on:
  workflow_dispatch:
    inputs:
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D'
        required: false
        type: string
        default: ''
      e:
        description: 'Extra box text (yellow)'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string
      brand:
        description: 'Brand / username watermark'
        required: false
        type: string
        default: 'perime.rw250'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_E: ${{ github.event.inputs.e }}
          INPUT_X: ${{ github.event.inputs.x }}
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'), path = require('path'), sharp = require('sharp');

            // ================================================================
            // ====================== CONFIGURATION ============================
            // ================================================================
            
            // ─── FILE & DIRECTORY PATHS ─────────────────────────────────────
            const CONFIG = {
              OUT_DIR: 'perimelight/outputfbimg',
              SIGNS_DIR: 'perimelight/signs',
              OVERLAY_PATH: path.join('perimelight', 'overlay', 'new.png'),
              SIGN_EXTENSIONS: ['.jpg', '.jpeg', '.png', '.webp']
            };
            
            // ─── SAFE ZONE CONFIGURATION ────────────────────────────────────
            const SAFE_ZONE = {
              x: 0.13,
              y: 0.15,
              w: 0.720,
              h: 0.713,
              PAD: 24,
              TOP_OFFSET: 50,
              BOTTOM_MARGIN: 40,
              MIN_CARD_HEIGHT: 200,
              MAX_CARD_HEIGHT: 0.85 // percentage of safe zone height
            };
            
            // ─── BOTTOM BORDER CONFIGURATION ────────────────────────────────
            const BORDER = {
              SHOW: true,
              Y_OFFSET: 28, // distance from options area
              LINE_COLOR: '#1565C0',
              LINE_WIDTH: 4,
              LINE_OPACITY: 0.8
            };
            
            // ─── TEXT STYLING CONFIGURATION ─────────────────────────────────
            const TEXT = {
              question: {
                fontMultiplier: 0.05,
                minFont: 20,
                maxFont: 36,
                lineHeightMultiplier: 1.3,
                color: '#1E1E1E',
                fontWeight: 700,
                fontFamily: 'Arial,Helvetica,sans-serif',
                paddingX: 40,
                paddingY: 20
              },
              option: {
                fontMultiplier: 0.047,
                minFont: 16,
                maxFont: 30,
                lineHeightMultiplier: 1.2,
                color: '#212121',
                fontWeight: 400,
                fontFamily: 'Arial,Helvetica,sans-serif',
                paddingX: 120
              },
              extra: {
                fontMultiplier: 0.045,
                minFont: 14,
                maxFont: 28,
                lineHeightMultiplier: 1.25,
                color: '#000000',
                fontWeight: 'bold',
                fontFamily: 'Arial,Helvetica,sans-serif',
                paddingX: 60,
                paddingY: 24
              },
              title: {
                show: false,
                prependQuestionNumber: true,
                height: 70,
                fontFamily: 'Arial,Helvetica,sans-serif',
                fontSize: 26,
                fontWeight: 700,
                color: '#1565C0',
                text: 'Ikibazo cya '
              }
            };
            
            // ─── OPTION BOX CONFIGURATION ──────────────────────────────────
            const OPTION = {
              height: 72,
              minHeight: 50,
              spacing: 14,
              borderRadius: 16,
              background: '#FFFFFF',
              stroke: '#E0E0E0',
              strokeWidth: 1.5,
              circle: {
                radius: 22,
                minRadius: 16,
                fill: '#E3F2FD',
                textColor: '#1565C0',
                fontSize: 20,
                minFontSize: 14,
                fontFamily: 'Arial Black,Arial,sans-serif',
                fontWeight: 900
              }
            };
            
            // ─── EXTRA BOX CONFIGURATION ────────────────────────────────────
            const EXTRA = {
              fill: '#FFF9C4',
              stroke: '#000000',
              strokeWidth: 1,
              borderRadius: 16,
              minHeight: 60,
              maxWidthPadding: 40,
              gap: 14,
              fixedBottomOffset: 40
            };
            
            // ─── IMAGE HANDLING CONFIGURATION ──────────────────────────────
            const IMAGE = {
              tag: '[image]',
              maxWidthPercent: 0.85,
              maxHeightPercent: 0.25,
              marginBottom: 16,
              marginTop: 8,
              fit: 'inside',
              withoutEnlargement: true,
              minHeight: 30
            };
            
            // ─── FONT SIZING ITERATION ─────────────────────────────────────
            const FONT_FITTING = {
              maxIterations: 100,
              reductionStep: 1
            };
            
            // ─── CARD STYLING ───────────────────────────────────────────────
            const CARD = {
              borderRadius: 26,
              background: '#FFFFFF00',
              stroke: '#FFFFFF00',
              strokeWidth: 2,
              padding: 20
            };
            
            // ================================================================
            // ==================== END CONFIGURATION =========================
            // ================================================================

            // ── INITIALIZATION ──────────────────────────────────────────────
            fs.mkdirSync(CONFIG.OUT_DIR, { recursive: true });

            if (!fs.existsSync(CONFIG.OVERLAY_PATH)) {
              throw new Error(`Missing overlay image: ${CONFIG.OVERLAY_PATH}`);
            }
            
            const base = sharp(CONFIG.OVERLAY_PATH);
            const { width: W, height: H } = await base.metadata();

            // ── SAFE ZONE CALCULATION ──────────────────────────────────────
            const SAFE = {
              x: Math.round(W * SAFE_ZONE.x),
              y: Math.round(H * SAFE_ZONE.y),
              w: Math.round(W * SAFE_ZONE.w),
              h: Math.round(H * SAFE_ZONE.h)
            };
            
            const CARD_W = SAFE.w - SAFE_ZONE.PAD * 2;
            const MAX_AVAILABLE_H = Math.min(
              SAFE.h - SAFE_ZONE.BOTTOM_MARGIN,
              SAFE.h * SAFE_ZONE.MAX_CARD_HEIGHT
            );
            const MIN_CARD_H = Math.min(SAFE_ZONE.MIN_CARD_HEIGHT, MAX_AVAILABLE_H);

            // ── INPUT PARSING ──────────────────────────────────────────────
            const qId = (process.env.INPUT_X || '1').trim();
            let qText = (process.env.INPUT_Q || '').replace(/\s+/g, ' ').trim();
            
            const rawOpts = {
              a: (process.env.INPUT_A || '').trim(),
              b: (process.env.INPUT_B || '').trim(),
              c: (process.env.INPUT_C || '').trim(),
              d: (process.env.INPUT_D || '').trim()
            };
            
            const extraText = (process.env.INPUT_E || '').trim();
            const hasExtraText = extraText.length > 0;

            // ── IMAGE DETECTION ─────────────────────────────────────────────
            const hasImg = new RegExp(IMAGE.tag, 'i').test(qText);
            if (hasImg) qText = qText.replace(new RegExp(IMAGE.tag, 'i'), '').trim();
            
            let signBuf = null, signH = 0, signW = 0;
            if (hasImg) {
              for (const ext of CONFIG.SIGN_EXTENSIONS) {
                const p = path.join(CONFIG.SIGNS_DIR, `${qId}${ext}`);
                if (!fs.existsSync(p)) continue;
                try {
                  const img = sharp(p);
                  const meta = await img.metadata();
                  const maxHeight = Math.min(
                    SAFE.h * IMAGE.maxHeightPercent,
                    MAX_AVAILABLE_H * 0.3
                  );
                  const maxWidth = Math.round(CARD_W * IMAGE.maxWidthPercent);
                  
                  signBuf = await img
                    .resize(maxWidth, maxHeight, { 
                      fit: IMAGE.fit, 
                      withoutEnlargement: IMAGE.withoutEnlargement 
                    })
                    .png()
                    .toBuffer();
                  const m = await sharp(signBuf).metadata();
                  signW = m.width;
                  signH = Math.max(m.height, IMAGE.minHeight);
                } catch (e) {
                  console.warn(`Failed to process image ${p}:`, e.message);
                  signBuf = null;
                }
                break;
              }
            }

            // ── OPTION CLEANING ─────────────────────────────────────────────
            const cleanOptionText = (text, optionKey) => {
              const pattern = new RegExp(`^${optionKey.toLowerCase()}\\s*[\\.\\)\\-\\:\\s]+`, 'i');
              if (pattern.test(text)) return text.replace(pattern, '').trim();
              const simplePattern = new RegExp(`^${optionKey.toLowerCase()}\\s+`, 'i');
              if (simplePattern.test(text)) return text.replace(simplePattern, '').trim();
              if (text.toLowerCase() === optionKey.toLowerCase()) return '';
              return text;
            };

            const opts = ['a','b','c','d']
              .filter(k => rawOpts[k] && rawOpts[k].length > 0)
              .map(k => {
                let text = rawOpts[k];
                let cleanText = cleanOptionText(text, k);
                if (!cleanText || cleanText.length === 0) cleanText = text;
                cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
                return { k: k.toUpperCase(), t: cleanText };
              });

            // ── TEXT HELPERS ──────────────────────────────────────────────────
            const cw = ch => /[iIl1|!.,;:'`"()\[\]{}\\\/]/.test(ch) ? 0.34 :
                            /[mwMW@%]/.test(ch) ? 0.72 :
                            /[A-Z]/.test(ch) ? 0.66 :
                            /[a-z]/.test(ch) ? 0.52 :
                            /[0-9]/.test(ch) ? 0.58 : 0.56;
            
            const textW = (s, fs) => {
              if (!s) return 0;
              return [...String(s)].reduce((a, c) => a + cw(c) * fs, 0);
            };
            
            const wrap = (t, maxW, fs) => {
              if (!t || t.length === 0) return [''];
              const words = String(t).trim().split(/\s+/);
              if (words.length === 0) return [''];
              
              const lines = [];
              let current = '';
              
              for (const word of words) {
                const test = current ? current + ' ' + word : word;
                if (textW(test, fs) <= maxW) {
                  current = test;
                  continue;
                }
                if (current) lines.push(current);
                if (textW(word, fs) > maxW) {
                  let partial = '';
                  for (const ch of word) {
                    if (textW(partial + ch, fs) <= maxW) {
                      partial += ch;
                    } else {
                      if (partial) lines.push(partial);
                      partial = ch;
                    }
                  }
                  current = partial;
                } else {
                  current = word;
                }
              }
              if (current) lines.push(current);
              return lines.length > 0 ? lines : [''];
            };

            // ── QUESTION TEXT ─────────────────────────────────────────────────
            let displayText = qText || 'Question';
            if (TEXT.title.prependQuestionNumber) {
              displayText = `Q${qId}: ${displayText}`;
            }

            // ── 1. CALCULATE LAYOUT WITH ADAPTIVE FITTING ──────────────────
            let qFont = Math.min(
              Math.max(Math.round(CARD_W * TEXT.question.fontMultiplier), TEXT.question.minFont),
              TEXT.question.maxFont
            );
            let oFont = Math.min(
              Math.max(Math.round(CARD_W * TEXT.option.fontMultiplier), TEXT.option.minFont),
              TEXT.option.maxFont
            );
            let extraFont = Math.min(
              Math.max(Math.round(CARD_W * TEXT.extra.fontMultiplier), TEXT.extra.minFont),
              TEXT.extra.maxFont
            );
            
            let bestLayout = null;
            let bestHeight = Infinity;
            
            // Try multiple font combinations
            for (let attempt = 0; attempt < FONT_FITTING.maxIterations; attempt++) {
              // Calculate wrapped text
              const qLines = wrap(displayText, CARD_W - TEXT.question.paddingX, qFont);
              const qLH = qFont * TEXT.question.lineHeightMultiplier;
              const qH = Math.max(qLines.length * qLH + TEXT.question.paddingY, 40);
              
              // Calculate options
              const oData = opts.map(o => {
                const ls = wrap(o.t, CARD_W - TEXT.option.paddingX, oFont);
                const lh = oFont * TEXT.option.lineHeightMultiplier;
                const h = Math.max(
                  Math.min(OPTION.height, OPTION.minHeight + 20),
                  ls.length * lh + 28
                );
                return { ...o, ls, lh, h };
              });
              
              // Calculate extra box
              let extraData = null;
              if (hasExtraText) {
                const maxW = CARD_W - EXTRA.maxWidthPadding;
                const extraLines = wrap(extraText, maxW, extraFont);
                const extraLH = extraFont * TEXT.extra.lineHeightMultiplier;
                const extraH = Math.max(
                  EXTRA.minHeight,
                  extraLines.length * extraLH + TEXT.extra.paddingY
                );
                extraData = { lines: extraLines, lh: extraLH, h: extraH, font: extraFont };
              }
              
              // Calculate total height
              let totalHeight = CARD.padding;
              const titleH = TEXT.title.show ? TEXT.title.height : 0;
              totalHeight += titleH;
              totalHeight += qH;
              
              if (signH > 0) {
                totalHeight += signH + IMAGE.marginTop + IMAGE.marginBottom;
              }
              
              // Options
              const optsH = oData.reduce((s, o) => s + o.h, 0) + (oData.length - 1) * OPTION.spacing;
              if (oData.length > 0) {
                totalHeight += optsH;
              }
              
              // Extra box (at bottom)
              if (hasExtraText && extraData) {
                totalHeight += EXTRA.gap + extraData.h;
              }
              
              totalHeight += CARD.padding;
              
              // Check if this layout fits
              if (totalHeight <= MAX_AVAILABLE_H && totalHeight < bestHeight) {
                bestHeight = totalHeight;
                bestLayout = {
                  qFont, oFont, extraFont,
                  qLines, qLH, qH,
                  oData, optsH,
                  extraData,
                  totalHeight,
                  titleH,
                  signH
                };
              }
              
              // Try to reduce font sizes for next iteration
              let reduced = false;
              if (qFont > TEXT.question.minFont && attempt % 2 === 0) {
                qFont = Math.max(qFont - FONT_FITTING.reductionStep, TEXT.question.minFont);
                reduced = true;
              }
              if (oFont > TEXT.option.minFont && (attempt % 3 === 0 || !reduced)) {
                oFont = Math.max(oFont - FONT_FITTING.reductionStep, TEXT.option.minFont);
                reduced = true;
              }
              if (hasExtraText && extraFont > TEXT.extra.minFont && (attempt % 4 === 0 || !reduced)) {
                extraFont = Math.max(extraFont - FONT_FITTING.reductionStep, TEXT.extra.minFont);
                reduced = true;
              }
              if (!reduced) break;
            }
            
            // If no layout fits, use the best found or create minimal layout
            if (!bestLayout) {
              console.warn('Content too large, creating minimal layout with truncation');
              
              // Force minimal layout
              const qLines = wrap(displayText.substring(0, 100), CARD_W - TEXT.question.paddingX, TEXT.question.minFont);
              const qLH = TEXT.question.minFont * TEXT.question.lineHeightMultiplier;
              const qH = Math.min(qLines.length * qLH + TEXT.question.paddingY, MAX_AVAILABLE_H * 0.3);
              
              const oData = opts.slice(0, 2).map(o => ({
                ...o,
                ls: wrap(o.t.substring(0, 50), CARD_W - TEXT.option.paddingX, TEXT.option.minFont),
                lh: TEXT.option.minFont * TEXT.option.lineHeightMultiplier,
                h: Math.max(OPTION.minHeight, 50)
              }));
              
              bestLayout = {
                qFont: TEXT.question.minFont,
                oFont: TEXT.option.minFont,
                extraFont: TEXT.extra.minFont,
                qLines,
                qLH,
                qH,
                oData,
                optsH: oData.length * 60,
                extraData: hasExtraText ? {
                  lines: wrap(extraText.substring(0, 80), CARD_W - EXTRA.maxWidthPadding, TEXT.extra.minFont),
                  lh: TEXT.extra.minFont * TEXT.extra.lineHeightMultiplier,
                  h: EXTRA.minHeight,
                  font: TEXT.extra.minFont
                } : null,
                totalHeight: Math.min(MAX_AVAILABLE_H, 400),
                titleH: 0,
                signH: 0
              };
            }

            // ── 2. BUILD CARD SVG ──────────────────────────────────────────
            const CARD_H = Math.min(bestLayout.totalHeight, MAX_AVAILABLE_H);
            const cardTop = SAFE.y + SAFE_ZONE.TOP_OFFSET;
            const cardLeft = Math.round(SAFE.x + (SAFE.w - CARD_W) / 2);
            
            const C = [];
            C.push(`<svg width="${CARD_W}" height="${CARD_H}" xmlns="http://www.w3.org/2000/svg">`);
            C.push(`<rect x="0" y="0" width="${CARD_W}" height="${CARD_H}" rx="${CARD.borderRadius}" fill="${CARD.background}" stroke="${CARD.stroke}" stroke-width="${CARD.strokeWidth}"/>`);

            // ── BUILD FROM BOTTOM UP ──────────────────────────────────────
            let y = CARD_H - CARD.padding;
            
            // 1. Extra box (bottom)
            if (hasExtraText && bestLayout.extraData) {
              const e = bestLayout.extraData;
              y -= e.h;
              C.push(`<rect x="${EXTRA.maxWidthPadding / 2}" y="${y}" width="${CARD_W - EXTRA.maxWidthPadding}" height="${e.h}" rx="${EXTRA.borderRadius}" fill="${EXTRA.fill}" stroke="${EXTRA.stroke}" stroke-width="${EXTRA.strokeWidth}"/>`);
              
              if (e.lines && e.lines.length > 0 && e.lines[0].length > 0) {
                e.lines.forEach((ln, li) => {
                  const textY = y + (e.h - e.lines.length * e.lh) / 2 + e.lh * 0.8 + li * e.lh;
                  C.push(`<text x="${EXTRA.maxWidthPadding}" y="${textY}" font-family="${TEXT.extra.fontFamily}" font-size="${e.font}" font-weight="${TEXT.extra.fontWeight}" fill="${TEXT.extra.color}">${escapeXml(ln)}</text>`);
                });
              }
              y -= EXTRA.gap;
            }
            
            // 2. Options
            if (bestLayout.oData && bestLayout.oData.length > 0) {
              const reversedOpts = [...bestLayout.oData].reverse();
              let optionY = y - bestLayout.optsH;
              
              reversedOpts.forEach((o, index) => {
                const actualIndex = bestLayout.oData.length - 1 - index;
                const oData = bestLayout.oData[actualIndex];
                const oY = optionY + oData.h;
                
                // Option box
                C.push(`<rect x="24" y="${oY - oData.h}" width="${CARD_W - 48}" height="${oData.h}" rx="${OPTION.borderRadius}" fill="${OPTION.background}" stroke="${OPTION.stroke}" stroke-width="${OPTION.strokeWidth}"/>`);
                
                // Circle
                const circleR = Math.min(OPTION.circle.radius, oData.h / 2 - 4);
                const circleFS = Math.min(OPTION.circle.fontSize, circleR * 0.9);
                C.push(`<circle cx="60" cy="${oY - oData.h / 2}" r="${circleR}" fill="${OPTION.circle.fill}"/>`);
                C.push(`<text x="60" y="${oY - oData.h / 2 + 7}" font-family="${OPTION.circle.fontFamily}" font-size="${circleFS}" font-weight="${OPTION.circle.fontWeight}" fill="${OPTION.circle.textColor}" text-anchor="middle">${oData.k}</text>`);
                
                // Option text
                if (oData.ls && oData.ls.length > 0 && oData.ls[0].length > 0) {
                  oData.ls.forEach((ln, li) => {
                    const textY = oY - oData.h + (oData.h - oData.ls.length * oData.lh) / 2 + oData.lh * 0.8 + li * oData.lh;
                    C.push(`<text x="100" y="${textY}" font-family="${TEXT.option.fontFamily}" font-size="${bestLayout.oFont}" fill="${TEXT.option.color}">${escapeXml(ln)}</text>`);
                  });
                }
                
                optionY += oData.h + OPTION.spacing;
              });
              
              y -= bestLayout.optsH;
              y -= 20; // gap before border
            }
            
            // 3. Border
            if (BORDER.SHOW) {
              const borderY = y;
              C.push(`<line x1="32" y1="${borderY}" x2="${CARD_W - 32}" y2="${borderY}" stroke="${BORDER.LINE_COLOR}" stroke-width="${BORDER.LINE_WIDTH}" opacity="${BORDER.LINE_OPACITY}"/>`);
              y -= 16;
            }
            
            // 4. Image
            if (signH > 0 && signBuf) {
              y -= signH + IMAGE.marginTop;
              const signY = y;
              // Store for composite
            }
            
            // 5. Question
            y -= bestLayout.qH - 8;
            
            if (bestLayout.qLines && bestLayout.qLines.length > 0) {
              bestLayout.qLines.forEach((ln, i) => {
                const textY = y + i * bestLayout.qLH;
                C.push(`<text x="${TEXT.question.paddingX / 2}" y="${textY}" font-family="${TEXT.question.fontFamily}" font-size="${bestLayout.qFont}" font-weight="${TEXT.question.fontWeight}" fill="${TEXT.question.color}">${escapeXml(ln)}</text>`);
              });
            }

            C.push(`</svg>`);

            // ── 3. COMPOSITE ──────────────────────────────────────────────────
            const cardBuf = await sharp(Buffer.from(C.join('\n'))).png().toBuffer();
            
            const composites = [{ input: cardBuf, left: cardLeft, top: cardTop }];
            
            if (signBuf && signH > 0) {
              // Calculate sign position
              let signY = CARD_H - CARD.padding;
              if (hasExtraText && bestLayout.extraData) {
                signY -= bestLayout.extraData.h + EXTRA.gap;
              }
              signY -= bestLayout.optsH + 36;
              
              const signTop = Math.round(cardTop + signY - signH - IMAGE.marginTop);
              const signLeft = Math.round(cardLeft + (CARD_W - signW) / 2);
              composites.push({ input: signBuf, left: signLeft, top: signTop });
            }

            // Save image
            const safeId = qId.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(CONFIG.OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);
            
            await base.composite(composites).png({ compressionLevel: 9 }).toFile(outFile);
            console.log('Generated:', outFile);
          })();

          function escapeXml(s) { 
            if (!s) return '';
            return String(s)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;'); 
          }
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image Q${{ github.event.inputs.x }}" && git push)
