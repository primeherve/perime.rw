name: Generate Quiz Image for Facebook

on:
  workflow_dispatch:
    inputs:
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D'
        required: false
        type: string
        default: ''
      e:
        description: 'Extra box text (yellow)'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string
      brand:
        description: 'Brand / username watermark'
        required: false
        type: string
        default: 'perime.rw250'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_E: ${{ github.event.inputs.e }}
          INPUT_X: ${{ github.event.inputs.x }}
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'), path = require('path'), sharp = require('sharp');

            // ====================================================================
            // =======================  CONFIGURATION  ============================
            // ====================================================================

            const OUT_DIR      = 'perimelight/outputfbimg';
            const SIGNS_DIR    = 'perimelight/signs';
            const OVERLAY_PATH = path.join('perimelight', 'overlay', 'new.png');

            const SAFE_X_RATIO = 0.13;
            const SAFE_Y_RATIO = 0.15;
            const SAFE_W_RATIO = 0.720;
            const SAFE_H_RATIO = 0.713;

            const CARD_PAD_X        = 20;
            const CARD_TOP_OFFSET   = 50;
            const CARD_BOTTOM_MARGIN= 40;

            const SHOW_TITLE_TEXT       = false;
            const PREPEND_QUESTION_NUM  = true;
            const Q_FONT_MULTIPLIER     = 0.05;
            const O_FONT_MULTIPLIER     = 0.047;
            const Q_LINE_HEIGHT_MULT    = 1.2;
            const O_LINE_HEIGHT_MULT    = 1.15;

            const OPTION_BOX_HEIGHT = 72;
            const OPTION_SPACING    = 16;
            const CIRCLE_RADIUS     = 22;
            const CIRCLE_FONT_SIZE  = 20;

            const EXTRA_BOX_FILL          = "#FFF9C4";
            const EXTRA_BOX_STROKE        = "#000000";
            const EXTRA_BOX_STROKE_WIDTH  = 1;
            const EXTRA_FONT_MULTIPLIER   = 0.045;
            const EXTRA_LINE_HEIGHT_MULT  = 1.25;
            const EXTRA_BOX_BOTTOM_MARGIN = 20;
            const EXTRA_BOX_WIDTH_RATIO   = 0.67;
            const EXTRA_BOX_GAP_ABOVE     = 12;

            const MIN_Q_FONT = 20;
            const MIN_O_FONT = 16;
            const MIN_EXTRA_FONT = 16;

            // ====================================================================
            // ====================  END OF CONFIGURATION  ========================
            // ====================================================================

            fs.mkdirSync(OUT_DIR, { recursive: true });

            if (!fs.existsSync(OVERLAY_PATH)) throw new Error('Missing overlay: ' + OVERLAY_PATH);
            const base = sharp(OVERLAY_PATH);
            const { width: W, height: H } = await base.metadata();

            const SAFE = {
              x: Math.round(W * SAFE_X_RATIO),
              y: Math.round(H * SAFE_Y_RATIO),
              w: Math.round(W * SAFE_W_RATIO),
              h: Math.round(H * SAFE_H_RATIO)
            };
            const CARD_W = SAFE.w - CARD_PAD_X * 2;

            const qId = (process.env.INPUT_X || '1').trim();
            let qText = (process.env.INPUT_Q || '').replace(/\s+/g, ' ').trim();
            const rawOpts = {
              a: (process.env.INPUT_A || '').trim(),
              b: (process.env.INPUT_B || '').trim(),
              c: (process.env.INPUT_C || '').trim(),
              d: (process.env.INPUT_D || '').trim()
            };
            const extraText = (process.env.INPUT_E || '').trim();
            const hasExtraText = extraText.length > 0;

            const hasImg = /\[image\]/i.test(qText);
            if (hasImg) qText = qText.replace(/\[image\]/i, '').trim();
            let signBuf = null, signH = 0, signW = 0;
            if (hasImg) {
              for (const ext of ['.jpg','.jpeg','.png','.webp']) {
                const p = path.join(SIGNS_DIR, `${qId}${ext}`);
                if (!fs.existsSync(p)) continue;
                signBuf = await sharp(p)
                  .resize(Math.round(CARD_W * 0.85), Math.round(SAFE.h * 0.3), {
                    fit: 'inside', withoutEnlargement: true
                  })
                  .png()
                  .toBuffer();
                const m = await sharp(signBuf).metadata();
                signW = m.width; signH = m.height;
                break;
              }
            }

            const cleanOptionText = (text, optionKey) => {
              const pattern = new RegExp(`^${optionKey}\\s*[\\.\\)\\-\\:\\s]+`, 'i');
              if (pattern.test(text)) return text.replace(pattern, '').trim();
              const simplePattern = new RegExp(`^${optionKey}\\s+`, 'i');
              if (simplePattern.test(text)) return text.replace(simplePattern, '').trim();
              if (text.toLowerCase() === optionKey.toLowerCase()) return '';
              return text;
            };

            const opts = ['a','b','c','d'].filter(k => rawOpts[k]).map(k => {
              let text = rawOpts[k];
              let cleanText = cleanOptionText(text, k);
              if (!cleanText || cleanText.length === 0) cleanText = text;
              cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
              return { k: k.toUpperCase(), t: cleanText };
            });

            // Text helpers
            const cw = ch => /[iIl1|!.,;:'`"()\[\]{}\\\/]/.test(ch) ? 0.34 :
                               /[mwMW@%]/.test(ch) ? 0.72 :
                               /[A-Z]/.test(ch) ? 0.66 :
                               /[a-z]/.test(ch) ? 0.52 :
                               /[0-9]/.test(ch) ? 0.58 : 0.56;
            const textW = (s, fs) => [...String(s)].reduce((a, c) => a + cw(c) * fs, 0);
            const wrap = (t, maxW, fs) => {
              const w = String(t).trim().split(/\s+/), L = [];
              let c = '';
              for (const wd of w) {
                const tr = c ? c + ' ' + wd : wd;
                if (textW(tr, fs) <= maxW) { c = tr; continue; }
                if (c) L.push(c);
                if (textW(wd, fs) > maxW) {
                  let p = '';
                  for (const ch of wd) {
                    if (textW(p + ch, fs) <= maxW) p += ch;
                    else { L.push(p); p = ch; }
                  }
                  c = p;
                } else c = wd;
              }
              if (c) L.push(c);
              return L;
            };

            let displayText = qText;
            if (PREPEND_QUESTION_NUM) displayText = `Q${qId}: ${qText}`;

            // Helper: try to layout the question card for a given available height
            const fitCardLayout = (availableHeight) => {
              let qFont = Math.round(CARD_W * Q_FONT_MULTIPLIER);
              let oFont = Math.round(CARD_W * O_FONT_MULTIPLIER);
              for (let i = 0; i < 40; i++) {
                const qLines = wrap(displayText, CARD_W - 64, qFont);
                const qLH = qFont * Q_LINE_HEIGHT_MULT;
                const oData = opts.map(o => {
                  const ls = wrap(o.t, CARD_W - 140, oFont);
                  const lh = oFont * O_LINE_HEIGHT_MULT;
                  const h = Math.max(OPTION_BOX_HEIGHT, ls.length * lh + 28);
                  return { ...o, ls, lh, h };
                });
                const titleH = SHOW_TITLE_TEXT ? 70 : 20;
                const qH = qLines.length * qLH + 24;
                const signBlock = signH ? signH + 24 : 0;
                const optsH = oData.reduce((s, o) => s + o.h, 0) + (oData.length - 1) * OPTION_SPACING;
                const totalH = titleH + qH + signBlock + optsH + 48;

                if (totalH <= availableHeight) {
                  return { success: true, layout: { qFont, oFont, qLines, qLH, oData, titleH, qH, signBlock, optsH, totalH } };
                }
                if (qLines.length > 3 && qFont > MIN_Q_FONT) qFont -= 2;
                else if (oFont > MIN_O_FONT) oFont -= 1;
                else if (qFont > MIN_Q_FONT) qFont -= 1;
                else break;
              }
              return { success: false };
            };

            // Extra box preparation (static bottom, grow upward)
            const cardTop = SAFE.y + CARD_TOP_OFFSET;
            let extraData = null, extraBoxTop = 0, extraBoxLeft = 0, extraBoxWidth = 0;
            let cardLayout = null;

            if (hasExtraText) {
              const extraBoxBottom = SAFE.y + SAFE.h - EXTRA_BOX_BOTTOM_MARGIN;
              extraBoxWidth = Math.round(W * EXTRA_BOX_WIDTH_RATIO);
              extraBoxLeft = Math.round((W - extraBoxWidth) / 2);
              const innerPadX = 80;

              const minCardLayoutRes = fitCardLayout(99999);
              if (!minCardLayoutRes.success) throw new Error('Even with minimum fonts the card content is too large.');
              const minCardH = minCardLayoutRes.layout.totalH;
              const maxExtraTop = cardTop + minCardH + EXTRA_BOX_GAP_ABOVE;
              let maxExtraH = extraBoxBottom - maxExtraTop;
              if (maxExtraH < 0) maxExtraH = 0;

              let minExtraLines = wrap(extraText, extraBoxWidth - innerPadX, MIN_EXTRA_FONT);
              let minExtraH = Math.max(OPTION_BOX_HEIGHT, minExtraLines.length * (MIN_EXTRA_FONT * EXTRA_LINE_HEIGHT_MULT) + 28);
              if (minExtraH > maxExtraH && maxExtraH > 0) {
                minExtraH = maxExtraH;
              }

              let lo = minExtraH, hi = Math.max(minExtraH, maxExtraH);
              let bestExtraH = lo;
              while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                const extraTop = extraBoxBottom - mid;
                const cardAvailableH = extraTop - EXTRA_BOX_GAP_ABOVE - cardTop;
                if (cardAvailableH <= 0) { hi = mid - 1; continue; }
                const trial = fitCardLayout(cardAvailableH);
                if (trial.success) {
                  bestExtraH = mid;
                  lo = mid + 1;
                } else {
                  hi = mid - 1;
                }
              }

              const finalExtraTop = extraBoxBottom - bestExtraH;
              let extraFont = Math.round(CARD_W * EXTRA_FONT_MULTIPLIER);
              let extraLines, extraH;
              while (extraFont >= MIN_EXTRA_FONT) {
                extraLines = wrap(extraText, extraBoxWidth - innerPadX, extraFont);
                extraH = Math.max(OPTION_BOX_HEIGHT, extraLines.length * (extraFont * EXTRA_LINE_HEIGHT_MULT) + 28);
                if (extraH <= bestExtraH) break;
                extraFont -= 1;
              }
              if (extraFont < MIN_EXTRA_FONT) { extraFont = MIN_EXTRA_FONT; extraLines = minExtraLines; extraH = minExtraH; }

              extraBoxTop = finalExtraTop;
              extraData = { ls: extraLines, lh: extraFont * EXTRA_LINE_HEIGHT_MULT, h: bestExtraH, font: extraFont };

              const cardAvailableH = extraBoxTop - EXTRA_BOX_GAP_ABOVE - cardTop;
              const cardRes = fitCardLayout(cardAvailableH);
              if (!cardRes.success) throw new Error('Unable to fit card after extra box height chosen.');
              cardLayout = cardRes.layout;
            } else {
              const availableH = SAFE.h - CARD_TOP_OFFSET - CARD_BOTTOM_MARGIN;
              const cardRes = fitCardLayout(availableH);
              if (!cardRes.success) throw new Error('Card content too tall for safe zone.');
              cardLayout = cardRes.layout;
            }

            const CARD_H = cardLayout.totalH;
            const cardLeft = Math.round(SAFE.x + (SAFE.w - CARD_W) / 2);

            const C = [];
            C.push(`<svg width="${CARD_W}" height="${CARD_H}" xmlns="http://www.w3.org/2000/svg">`);
            C.push(`<rect x="0" y="0" width="${CARD_W}" height="${CARD_H}" rx="26" fill="#FFFFFF00" stroke="#FFFFFF00" stroke-width="2"/>`);

            if (SHOW_TITLE_TEXT) {
              C.push(`<text x="32" y="48" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1565C0">Ikibazo cya ${escapeXml(qId)}</text>`);
            }

            let y = cardLayout.titleH + 8;
            cardLayout.qLines.forEach((ln, i) => {
              C.push(`<text x="32" y="${y + i * cardLayout.qLH}" font-family="Arial,Helvetica,sans-serif" font-size="${cardLayout.qFont}" font-weight="700" fill="#1E1E1E">${escapeXml(ln)}</text>`);
            });
            y += cardLayout.qH + cardLayout.signBlock;

            cardLayout.oData.forEach(o => {
              C.push(`<rect x="24" y="${y}" width="${CARD_W - 48}" height="${o.h}" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>`);
              C.push(`<circle cx="60" cy="${y + o.h / 2}" r="${CIRCLE_RADIUS}" fill="#E3F2FD"/>`);
              C.push(`<text x="60" y="${y + o.h / 2 + 7}" font-family="Arial Black,Arial,sans-serif" font-size="${CIRCLE_FONT_SIZE}" font-weight="900" fill="#1565C0" text-anchor="middle">${o.k}</text>`);
              o.ls.forEach((ln, li) => {
                C.push(`<text x="100" y="${y + (o.h - o.ls.length * o.lh) / 2 + o.lh * 0.8 + li * o.lh}" font-family="Arial,Helvetica,sans-serif" font-size="${cardLayout.oFont}" fill="#212121">${escapeXml(ln)}</text>`);
              });
              y += o.h + OPTION_SPACING;
            });

            C.push(`</svg>`);

            let extraBoxBuf = null;
            if (extraData) {
              const e = extraData;
              const EX = [];
              EX.push(`<svg width="${extraBoxWidth}" height="${e.h}" xmlns="http://www.w3.org/2000/svg">`);
              EX.push(`<rect x="0" y="0" width="${extraBoxWidth}" height="${e.h}" rx="16" fill="${EXTRA_BOX_FILL}" stroke="${EXTRA_BOX_STROKE}" stroke-width="${EXTRA_BOX_STROKE_WIDTH}"/>`);
              e.ls.forEach((ln, li) => {
                EX.push(`<text x="48" y="${(e.h - e.ls.length * e.lh) / 2 + e.lh * 0.8 + li * e.lh}" font-family="Arial,Helvetica,sans-serif" font-size="${e.font}" font-weight="bold" fill="#000000">${escapeXml(ln)}</text>`);
              });
              EX.push(`</svg>`);
              extraBoxBuf = await sharp(Buffer.from(EX.join('\n'))).png().toBuffer();
            }

            const cardBuf = await sharp(Buffer.from(C.join('\n'))).png().toBuffer();
            const composites = [{ input: cardBuf, left: Math.round(cardLeft), top: Math.round(cardTop) }];

            if (signBuf) {
              const signTop = cardTop + cardLayout.titleH + cardLayout.qH + 12;
              const signLeft = cardLeft + (CARD_W - signW) / 2;
              composites.push({ input: signBuf, left: Math.round(signLeft), top: Math.round(signTop) });
            }
            if (extraBoxBuf) {
              composites.push({ input: extraBoxBuf, left: Math.round(extraBoxLeft), top: Math.round(extraBoxTop) });
            }

            const safeId = qId.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);
            await base.composite(composites).png({ compressionLevel: 9 }).toFile(outFile);
            console.log('Generated:', outFile);
          })();

          function escapeXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image Q${{ github.event.inputs.x }}" && git push)
