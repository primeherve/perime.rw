name: Generate Quiz Image for Facebook

on:
  workflow_dispatch:
    inputs:
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D'
        required: false
        type: string
        default: ''
      e:
        description: 'Extra box text (yellow)'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string
      brand:
        description: 'Brand / username watermark'
        required: false
        type: string
        default: 'perime.rw250'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_E: ${{ github.event.inputs.e }}
          INPUT_X: ${{ github.event.inputs.x }}
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'), path = require('path'), sharp = require('sharp');

            // ================================================================
            // ====================== CONFIGURATION ============================
            // ================================================================
            
            // ─── DIRECTORIES ────────────────────────────────────────────────
            const OUT_DIR = 'perimelight/outputfbimg';
            const SIGNS_DIR = 'perimelight/signs';
            const OVERLAY_PATH = path.join('perimelight', 'overlay', 'rise.png');
            
            // ─── FONT SIZE CONFIGURATION ──────────────────────────────────
            const qFontMultiplier = 0.05;
            const oFontMultiplier = 0.047;
            const extraFontMultiplier = 0.05;   // own font size for extra box
            
            // ─── LINE HEIGHT CONFIGURATION ────────────────────────────────
            const qLineHeightMultiplier = 1.2;
            const oLineHeightMultiplier = 1.15;
            const extraLineHeightMultiplier = 1.25;   // slightly more for bold
            
            // ─── TITLE DISPLAY CONFIGURATION ──────────────────────────────
            const showTitleText = false;
            const prependQuestionNumber = true;
            
            // ─── OPTION BOX CONFIGURATION ─────────────────────────────────
            const optionBoxHeight = 72;
            const optionSpacing = 16;
            const circleRadius = 22;
            const circleFontSize = 20;
            
            // ─── EXTRA BOX STYLE ──────────────────────────────────────────
            const extraBoxFill = "#FFF9C4";    // light yellow
            const extraBoxStroke = "#000000";
            const extraBoxStrokeWidth = 1;
            // minimum free space (px) required to show the extra box
            const minFreeSpaceForExtra = 120;   // safe margin
            
            // ================================================================
            // ==================== END CONFIGURATION =========================
            // ================================================================

            fs.mkdirSync(OUT_DIR, { recursive: true });

            if (!fs.existsSync(OVERLAY_PATH)) throw new Error('Missing overlay image: overlay image/rise.png');
            const base = sharp(OVERLAY_PATH);
            const { width: W, height: H } = await base.metadata();

            // ── SAFE ZONE ────────────────────────────────────────────────────
            const SAFE = {
              x: Math.round(W * 0.13),
              y: Math.round(H * 0.15),
              w: Math.round(W * 0.720),
              h: Math.round(H * 0.713)
            };
            const PAD = 24;
            const CARD_W = SAFE.w - PAD * 2;

            // ── INPUTS ────────────────────────────────────────────────────────
            const qId = (process.env.INPUT_X || '1').trim();
            let qText = (process.env.INPUT_Q || '').replace(/\s+/g, ' ').trim();
            const rawOpts = {
              a: (process.env.INPUT_A || '').trim(),
              b: (process.env.INPUT_B || '').trim(),
              c: (process.env.INPUT_C || '').trim(),
              d: (process.env.INPUT_D || '').trim()
            };
            const extraText = (process.env.INPUT_E || '').trim();
            const hasExtraText = extraText.length > 0;

            // ── OPTIONAL SIGN IMAGE [image] ───────────────────────────────────
            const hasImg = /\[image\]/i.test(qText);
            if (hasImg) qText = qText.replace(/\[image\]/i, '').trim();
            let signBuf = null, signH = 0, signW = 0;
            if (hasImg) {
              for (const ext of ['.jpg','.jpeg','.png','.webp']) {
                const p = path.join(SIGNS_DIR, `${qId}${ext}`);
                if (!fs.existsSync(p)) continue;
                signBuf = await sharp(p).resize(Math.round(CARD_W*0.85), Math.round(SAFE.h*0.3), {fit:'inside', withoutEnlargement:true}).png().toBuffer();
                const m = await sharp(signBuf).metadata(); signW=m.width; signH=m.height; break;
              }
            }

            // ── OPTIONS (clean text) ─────────────────────────────────────────
            const cleanOptionText = (text, optionKey) => {
              const pattern = new RegExp(`^${optionKey.toLowerCase()}\\s*[\\.\\)\\-\\:\\s]+`, 'i');
              if (pattern.test(text)) return text.replace(pattern, '').trim();
              const simplePattern = new RegExp(`^${optionKey.toLowerCase()}\\s+`, 'i');
              if (simplePattern.test(text)) return text.replace(simplePattern, '').trim();
              if (text.toLowerCase() === optionKey.toLowerCase()) return '';
              return text;
            };

            const opts = ['a','b','c','d'].filter(k=>rawOpts[k]).map(k => {
              let text = rawOpts[k];
              let cleanText = cleanOptionText(text, k);
              if (!cleanText || cleanText.length === 0) cleanText = text;
              cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
              return { k: k.toUpperCase(), t: cleanText };
            });

            // ── TEXT HELPERS ──────────────────────────────────────────────────
            const cw = ch => /[iIl1|!.,;:'`"()\[\]{}\\\/]/.test(ch)?0.34 : /[mwMW@%]/.test(ch)?0.72 : /[A-Z]/.test(ch)?0.66 : /[a-z]/.test(ch)?0.52 : /[0-9]/.test(ch)?0.58 : 0.56;
            const textW = (s,fs)=>[...String(s)].reduce((a,c)=>a+cw(c)*fs,0);
            const wrap = (t,maxW,fs)=>{ const w=String(t).trim().split(/\s+/), L=[]; let c=''; for(const wd of w){ const tr=c?c+' '+wd:wd; if(textW(tr,fs)<=maxW){c=tr;continue} if(c)L.push(c); if(textW(wd,fs)>maxW){let p=''; for(const ch of wd){if(textW(p+ch,fs)<=maxW)p+=ch; else{L.push(p);p=ch}} c=p}else c=wd } if(c)L.push(c); return L };

            // ── QUESTION TEXT ─────────────────────────────────────────────────
            let displayText = qText;
            if (prependQuestionNumber) displayText = `Q${qId}: ${qText}`;

            // ── FIT QUESTION + OPTIONS ONLY (no extra box yet) ────────────────
            let qFont = Math.round(CARD_W * qFontMultiplier);
            let oFont = Math.round(CARD_W * oFontMultiplier);
            let baseLayout = null;
            for (let i = 0; i < 35; i++) {
              const qLines = wrap(displayText, CARD_W - 64, qFont);
              const qLH = qFont * qLineHeightMultiplier;
              const oData = opts.map(o => {
                const ls = wrap(o.t, CARD_W - 140, oFont);
                const lh = oFont * oLineHeightMultiplier;
                const h = Math.max(optionBoxHeight, ls.length * lh + 28);
                return { ...o, ls, lh, h };
              });
              const titleH = showTitleText ? 70 : 20;
              const qH = qLines.length * qLH + 24;
              const signBlock = signH ? signH + 24 : 0;
              const optsH = oData.reduce((s, o) => s + o.h, 0) + (oData.length - 1) * optionSpacing;
              const totalH = titleH + qH + signBlock + optsH + 48;   // padding bottom

              if (totalH <= SAFE.h - 40) {
                baseLayout = { qFont, oFont, qLines, qLH, oData, titleH, qH, signBlock, optsH, totalH };
                break;
              }
              // reduce fonts to fit
              if (qLines.length > 3 && qFont > 28) qFont -= 2;
              else if (oFont > 22) oFont -= 1;
              else qFont -= 1;
            }
            if (!baseLayout) throw new Error('Text too long for safe zone');

            // ── CHECK IF EXTRA BOX CAN BE ADDED WITH SPARE SPACE ─────────────
            let extraData = null;
            if (hasExtraText) {
              const availableSpace = SAFE.h - 40 - baseLayout.totalH;
              if (availableSpace >= minFreeSpaceForExtra) {
                const extraFont = Math.round(CARD_W * extraFontMultiplier);
                const maxW = CARD_W - 80;   // no circle, wider text area
                const extraLines = wrap(extraText, maxW, extraFont);
                const extraLH = extraFont * extraLineHeightMultiplier;
                const extraH = Math.max(optionBoxHeight, extraLines.length * extraLH + 28);
                // check if extra box actually fits in the available space (with spacing)
                if (availableSpace >= extraH + optionSpacing) {
                  extraData = { ls: extraLines, lh: extraLH, h: extraH, font: extraFont };
                }
              }
            }

            // ── BUILD FINAL LAYOUT ────────────────────────────────────────────
            const extraBlock = extraData ? optionSpacing + extraData.h : 0;
            const finalTotalH = baseLayout.totalH + extraBlock;
            const CARD_H = Math.round(Math.min(finalTotalH, SAFE.h - 20));

            // ── BUILD CARD SVG ────────────────────────────────────────────────
            const C = [];
            C.push(`<svg width="${CARD_W}" height="${CARD_H}" xmlns="http://www.w3.org/2000/svg">`);
            C.push(`<rect x="0" y="0" width="${CARD_W}" height="${CARD_H}" rx="26" fill="#FFFFFF00" stroke="#FFFFFF00" stroke-width="2"/>`);

            if (showTitleText) {
              C.push(`<text x="32" y="48" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1565C0">Ikibazo cya ${escapeXml(qId)}</text>`);
            }

            let y = baseLayout.titleH + 8;
            baseLayout.qLines.forEach((ln, i) => {
              C.push(`<text x="32" y="${y + i * baseLayout.qLH}" font-family="Arial,Helvetica,sans-serif" font-size="${baseLayout.qFont}" font-weight="700" fill="#1E1E1E">${escapeXml(ln)}</text>`);
            });
            y += baseLayout.qH;
            y += baseLayout.signBlock;

            // Regular option boxes
            baseLayout.oData.forEach(o => {
              C.push(`<rect x="24" y="${y}" width="${CARD_W - 48}" height="${o.h}" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>`);
              C.push(`<circle cx="60" cy="${y + o.h / 2}" r="${circleRadius}" fill="#E3F2FD"/>`);
              C.push(`<text x="60" y="${y + o.h / 2 + 7}" font-family="Arial Black,Arial,sans-serif" font-size="${circleFontSize}" font-weight="900" fill="#1565C0" text-anchor="middle">${o.k}</text>`);
              o.ls.forEach((ln, li) => {
                C.push(`<text x="100" y="${y + (o.h - o.ls.length * o.lh) / 2 + o.lh * 0.8 + li * o.lh}" font-family="Arial,Helvetica,sans-serif" font-size="${baseLayout.oFont}" fill="#212121">${escapeXml(ln)}</text>`);
              });
              y += o.h + optionSpacing;
            });

            // Extra yellow box (only if it could be added)
            if (extraData) {
              const e = extraData;
              C.push(`<rect x="24" y="${y}" width="${CARD_W - 48}" height="${e.h}" rx="16" fill="${extraBoxFill}" stroke="${extraBoxStroke}" stroke-width="${extraBoxStrokeWidth}"/>`);
              e.ls.forEach((ln, li) => {
                C.push(`<text x="48" y="${y + (e.h - e.ls.length * e.lh) / 2 + e.lh * 0.8 + li * e.lh}" font-family="Arial,Helvetica,sans-serif" font-size="${e.font}" font-weight="bold" fill="#000000">${escapeXml(ln)}</text>`);
              });
              y += e.h + optionSpacing; // not strictly needed but keeps consistency
            }

            C.push(`</svg>`);

            const cardBuf = await sharp(Buffer.from(C.join('\n'))).png().toBuffer();
            const left = Math.round(SAFE.x + (SAFE.w - CARD_W) / 2);
            const top = Math.round(SAFE.y + (SAFE.h - CARD_H) / 2);

            const composites = [{ input: cardBuf, left, top }];
            if (signBuf) {
              const signTop = Math.round(top + baseLayout.titleH + baseLayout.qH + 12);
              const signLeft = Math.round(left + (CARD_W - signW) / 2);
              composites.push({ input: signBuf, left: signLeft, top: signTop });
            }

            const safeId = qId.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);
            await base.composite(composites).png({ compressionLevel: 9 }).toFile(outFile);
            console.log('Generated:', outFile);
          })();

          function escapeXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image Q${{ github.event.inputs.x }}" && git push)
