name: Generate Quiz Video
on:
  workflow_dispatch:
    inputs:
      q: { description: 'Question text', required: true, type: string }
      a: { description: 'Option A', required: true, type: string }
      b: { description: 'Option B', required: true, type: string }
      c: { description: 'Option C', required: false, type: string, default: '' }
      d: { description: 'Option D', required: false, type: string, default: '' }
      x: { description: 'Question number/ID', required: true, type: string }

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install FFmpeg and Sharp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          npm install sharp

      - name: Generate video
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_X: ${{ github.event.inputs.x }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),os=require('os'),{execSync}=require('child_process'),sharp=require('sharp');
          const OUT='roadrules/output',TMP='roadrules/temp',MUSIC='roadrules/song';
          [OUT,TMP].forEach(d=>fs.mkdirSync(d,{recursive:true}));

          const q={id:process.env.INPUT_X||'1',text:process.env.INPUT_Q||'',opts:{a:process.env.INPUT_A,b:process.env.INPUT_B,c:process.env.INPUT_C,d:process.env.INPUT_D}};
          const num=parseInt(q.id)||1;

          // Safe text handling
          const escXml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const escTS=s=>String(s).replace(/`/g,'\\`').replace(/\$\{/g,'\\${');
          const esc=s=>escTS(escXml(s));   // combined for both SVG XML and template literal safety

          // --- STYLES ---
          const STYLES=[
            {
    n: 'red',
    g1: '#FF003D',
    g2: '#FF4D6D',
    card: '#FFD1DA',
    opts: ['#FF9100', '#00E676', '#2979FF', '#D500F9'],
    dark: false
  },
  {
    n: 'orange',
    g1: '#FF6A00',
    g2: '#FF9500',
    card: '#FFE0BF',
    opts: ['#FF1744', '#00C2FF', '#7C4DFF', '#FFD600'],
    dark: false
  },
  {
    n: 'violet',
    g1: '#7A00FF',
    g2: '#B026FF',
    card: '#E8CCFF',
    opts: ['#FF6D00', '#00E676', '#00C2FF', '#FFEA00'],
    dark: false
  },
  {
    n: 'blue',
    g1: '#005DFF',
    g2: '#3D8BFF',
    card: '#D4E3FF',
    opts: ['#FF6D00', '#00E676', '#D500F9', '#FFD600'],
    dark: false
  },
  {
    n: 'green',
    g1: '#00C93C',
    g2: '#00F076',
    card: '#CCFFE0',
    opts: ['#FF3D00', '#00C2FF', '#7A00FF', '#FFD600'],
    dark: false
  },
  {
    n: 'yellow',
    g1: '#FFD500',
    g2: '#FFF000',
    card: '#FFF3B8',
    opts: ['#FF3D00', '#00D5FF', '#7C00FF', '#FF4081'],
    dark: false
  },
  {
    n: 'purple',
    g1: '#8A00D4',
    g2: '#D000FF',
    card: '#F0CCFF',
    opts: ['#FF6A00', '#00E676', '#2979FF', '#FFD600'],
    dark: false
  },
  {
    n: 'magneta',
    g1: '#FF0099',
    g2: '#FF33CC',
    card: '#FFD1F0',
    opts: ['#00E676', '#FF9100', '#2962FF', '#FFF000'],
    dark: false
  },
  {
    n: 'aqua',
    g1: '#00D9FF',
    g2: '#00FFF0',
    card: '#CCFAFF',
    opts: ['#FF3D00', '#7A00FF', '#FFD600', '#00E676'],
    dark: false
  },
  {
    n: 'pink',
    g1: '#FF2D75',
    g2: '#FF66B2',
    card: '#FFD6E8',
    opts: ['#00C2FF', '#76FF03', '#7A00FF', '#FF9500'],
    dark: false
  }
          ];
          const style=STYLES[Math.floor(Math.random()*STYLES.length)];
          const pillR=18+Math.floor(Math.random()*10), cardR=32+Math.floor(Math.random()*12), shadow=18+Math.floor(Math.random()*10);

          // --- ADAPTIVE TEXT LAYOUT ---
          const estimateWidth=(t,fs)=>t.length*fs*0.56;
          function wrapText(text,maxW,fs){const w=String(text).trim().split(/\s+/),l=[];let c='';for(const wd of w){const t=c?c+' '+wd:wd;if(estimateWidth(t,fs)<=maxW){c=t;continue}if(c)l.push(c);if(estimateWidth(wd,fs)>maxW){let p='';for(const ch of wd){if(estimateWidth(p+ch,fs)<=maxW)p+=ch;else{l.push(p);p=ch}}c=p}else c=wd}if(c)l.push(c);return l}
          function buildLayout(){
            const opts=['a','b','c','d'].filter(k=>q.opts[k]).map(k=>{
              let t = String(q.opts[k]).replace(/^[A-D][\)\.\-:]?\s*/i,'').trim();
              if (t && /^[a-z]/.test(t)) {
                t = t.charAt(0).toUpperCase() + t.slice(1);
              }
              return {k:k.toUpperCase(), t};
            });
            const TW=554,OW=440; let qF=34,oF=25;
            for(let i=0;i<25;i++){
              const qL=wrapText(q.text,TW,qF), qH=qL.length*qF*1.35;
              const od=opts.map(o=>{const ls=wrapText(o.t,OW,oF),lh=oF*1.26,ph=Math.max(72,ls.length*lh+34);return{...o,lines:ls,lh,pillH:ph}});
              const th=90+qH+30+od.reduce((s,o)=>s+o.pillH,0)+Math.max(0,od.length-1)*16+56;
              if(th<=1180 && qL.length<=12 && od.every(o=>o.lines.length<=8)) return{qF,oF,qL,qH,od,th};
              if(qH>400 || qL.length>7) qF=Math.max(20,qF-1); else oF=Math.max(17,oF-1);
            }
            const qL=wrapText(q.text,TW,20), qH=qL.length*20*1.35;
            const od=opts.map(o=>{const ls=wrapText(o.t,OW,17),lh=17*1.26;return{...o,lines:ls,lh,pillH:Math.max(72,ls.length*lh+34)}});
            const th=90+qH+30+od.reduce((s,o)=>s+o.pillH,0)+Math.max(0,od.length-1)*16+56;
            return{qF:20,oF:17,qL,qH,od,th:Math.min(th,1200)};
          }
          const L=buildLayout(), top=Math.max(20,(1280-L.th)/2-20);
          const icons=[`<g opacity="0.13"><polygon points="30,0 70,0 100,30 100,70 70,100 30,100 0,70 0,30" fill="#DC2626" transform="translate(80,200) scale(0.9)"/><text x="130" y="262" font-size="24" fill="white" font-weight="800" text-anchor="middle">STOP</text></g>`,`<g opacity="0.12"><polygon points="50,0 100,87 0,87" fill="#EAB308" stroke="#000" stroke-width="3" transform="translate(550,900) scale(0.9)"/><text x="600" y="965" font-size="22" fill="black" font-weight="800" text-anchor="middle">!</text></g>`,`<g opacity="0.14" transform="translate(500,250)"><rect x="0" y="0" width="60" height="140" rx="12" fill="#1F2937"/><circle cx="30" cy="30" r="18" fill="#DC2626"/><circle cx="30" cy="70" r="18" fill="#EAB308"/><circle cx="30" cy="110" r="18" fill="#16A34A"/></g>`,`<g opacity="0.13" transform="translate(100,950)"><circle cx="50" cy="50" r="48" fill="white" stroke="#DC2626" stroke-width="8"/><text x="50" y="62" font-size="36" font-weight="800" fill="black" text-anchor="middle">50</text></g>`];
          const roadDecor=icons.sort(()=>0.5-Math.random()).slice(0,2).join('');

          const textColor=style.dark?'#F8FAFC':'#0F172A';
          const cardFill=style.dark?'#0F172A':style.card;
          const cardStroke=style.dark?'rgba(255,255,255,0.09)':'rgba(15,23,42,0.09)';
          const optionBg=style.dark?'#111827':'#FFFFFF';
          const optionStroke=style.dark?'#1F2937':'#E5E7EB';

          // --- THEME COLLECTION ---
          const THEMES = [
            // 1: ORIGINAL NEON/GRID STYLE (now with proper escaping)
            ()=>{
              return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="qG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${style.g1}"/><stop offset="100%" stop-color="${style.g2}"/></linearGradient><linearGradient id="optG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(255,255,255,0.15)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></linearGradient><filter id="neon"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="s"><feDropShadow dx="0" dy="15" stdDeviation="${shadow}" flood-opacity="0.5" flood-color="#000"/></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="${style.g1}" stroke-opacity="0.07" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g opacity="0.15">${roadDecor}</g><rect width="720" height="1280" fill="url(#grid)"/><g transform="translate(35,${top})"><path d="M 0 20 L 20 0 L 630 0 L 650 20 L 650 ${L.th-20} L 630 ${L.th} L 20 ${L.th} L 0 ${L.th-20} Z" fill="${cardFill}" stroke="url(#qG)" stroke-width="2.5" filter="url(#s)"/><path d="M 0 20 L 20 0 L 630 0 L 650 20 L 650 ${L.th-20} L 630 ${L.th} L 20 ${L.th} L 0 ${L.th-20} Z" fill="none" stroke="url(#qG)" stroke-width="2.5" filter="url(#neon)"/><path d="M 15 10 L 40 10 M 635 10 L 610 10 M 15 ${L.th-10} L 40 ${L.th-10} M 635 ${L.th-10} L 610 ${L.th-10}" stroke="${style.opts[0]||'#0ff'}" stroke-width="3" filter="url(#neon)"/><path d="M 20 -40 L 200 -40 L 220 -20 L 220 0 L 20 0 Z" fill="url(#qG)" opacity="0.95" filter="url(#neon)"/><text x="120" y="-12" font-family="Orbitron, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">Q - ${esc(num)}</text>${L.qL.map((l,i)=>`<text x="50" y="${70+i*L.qF*1.4}" font-family="Orbitron, sans-serif" font-size="${L.qF}" font-weight="800" fill="${textColor}">${esc(l)}</text>`).join('')}${(() => {let y=70+L.qH+35, s=''; L.od.forEach((o,i)=>{const col=style.opts[i%4]; s+=`<g transform="translate(40,${y})"><path d="M 15 0 L 555 0 L 570 15 L 570 ${o.pillH} L 15 ${o.pillH} L 0 ${o.pillH-15} Z" fill="${optionBg}" stroke="${col}" stroke-width="1.5"/><path d="M 15 0 L 555 0 L 570 15 L 570 ${o.pillH} L 15 ${o.pillH} L 0 ${o.pillH-15} Z" fill="url(#optG)" opacity="0.8"/><polygon points="0,${o.pillH-15} 15,${o.pillH} 45,${o.pillH} 30,${o.pillH-15}" fill="${col}" opacity="0.3"/><rect x="-5" y="${o.pillH/2-10}" width="5" height="20" fill="${col}" filter="url(#neon)"/><circle cx="45" cy="${o.pillH/2}" r="18" fill="none" stroke="${col}" stroke-width="2.5" filter="url(#neon)"/><text x="45" y="${o.pillH/2+6}" font-family="Orbitron, sans-serif" font-size="16" font-weight="900" fill="${col}" text-anchor="middle">${o.k}</text>`;const tb=o.lines.length*o.lh,fb=(o.pillH-tb)/2+o.lh*0.75;o.lines.forEach((ln,li)=>s+=`<text x="85" y="${fb+li*o.lh}" font-family="Orbitron, sans-serif" font-size="${L.oF}" font-weight="600" fill="${textColor}">${esc(ln)}</text>`);s+=`</g>`;y+=o.pillH+18}); return s;})()}<g transform="translate(665, 40)"><polygon points="0,0 8,0 8,25 0,30" fill="${style.opts[0]}" filter="url(#neon)"/><polygon points="0,40 6,40 6,55 0,60" fill="${style.opts[1]}" opacity="0.8"/><polygon points="0,70 4,70 4,110 0,115" fill="${style.opts[2]}" opacity="0.4"/></g></g></svg>`;
            },

            // 3: ULTRA PREMIUM
            () => {
              return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
                <defs>
                  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${style.g1}"/>
                    <stop offset="100%" stop-color="${style.g2}"/>
                  </linearGradient>
                  <linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${style.g1}" stop-opacity="0.22"/>
                    <stop offset="100%" stop-color="${style.g2}" stop-opacity="0.06"/>
                  </linearGradient>
                  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="white" stop-opacity="${style.dark?0.15:0.85}"/>
                    <stop offset="38%" stop-color="white" stop-opacity="0.06"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0"/>
                  </linearGradient>
                  <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="32" stdDeviation="${shadow+6}" flood-opacity="${style.dark?0.55:0.2}"/>
                    <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.08"/>
                  </filter>
                  <filter id="glow">
                    <feGaussianBlur stdDeviation="14" result="b"/>
                    <feMerge>
                      <feMergeNode in="b"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                  <filter id="textDepth" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
                  </filter>
                  <linearGradient id="badgeHL" x1="0%" y1="0%" x2="100%" y2="120%">
                    <stop offset="0%" stop-color="white" stop-opacity="0.48"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <g opacity="0.1">${roadDecor}</g>
                <g transform="translate(35,${top})">
                  <rect width="650" height="${L.th}" rx="${cardR+12}" fill="none" stroke="url(#g)" stroke-width="2.5" opacity="0.4" filter="url(#glow)"/>
                  <rect width="650" height="${L.th}" rx="${cardR+10}" fill="${cardFill}" stroke="${cardStroke}" stroke-width="2.2" filter="url(#s)"/>
                  <rect x="5" y="5" width="640" height="${L.th-10}" rx="${cardR+6}" fill="${cardFill}"/>
                  <rect x="5" y="5" width="640" height="${Math.min(285, L.th*0.53)}" rx="${cardR+6}" fill="url(#sheen)"/>
                  <rect x="6" y="6" width="638" height="${L.th-12}" rx="${cardR+5}" fill="url(#gSoft)" opacity="${style.dark?0.28:0.5}"/>
                  <rect x="10" y="10" width="630" height="${L.th-20}" rx="${cardR+2}" fill="none" stroke="${style.dark?'#ffffff':'#0F172A'}" stroke-opacity="${style.dark?0.1:0.12}" stroke-width="1.8"/>
                  <g transform="translate(36,-36)" filter="url(#s)">
                    <rect width="196" height="76" rx="26" fill="url(#g)"/>
                    <rect x="3" y="3" width="190" height="70" rx="23" fill="${style.dark?'#1E293B':'#FFFFFF'}" fill-opacity="0.2"/>
                    <rect x="4" y="4" width="188" height="68" rx="22" fill="url(#g)"/>
                    <rect x="8" y="8" width="180" height="60" rx="18" fill="url(#g)"/>
                    <rect x="8" y="8" width="180" height="60" rx="18" fill="url(#badgeHL)" opacity="0.75"/>
                    <text x="98" y="47" font-family="Inter,Arial" font-size="29" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2.5" filter="url(#textDepth)">Q${esc(num)}</text>
                  </g>
                  ${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Inter,Arial" font-size="${L.qF}" font-weight="750" fill="${textColor}" letter-spacing="-0.18" filter="url(#textDepth)">${esc(l)}</text>`).join('')}
                  ${(() => {
                    let y = 90 + L.qH + 30, s = '';
                    L.od.forEach((o,i) => {
                      const col = style.opts[i%4];
                      s += `<g>
                        <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR+4}" fill="${optionBg}" stroke="${optionStroke}" stroke-width="2"/>
                        <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR+4}" fill="url(#gSoft)" opacity="0.18"/>
                        <rect x="40" y="${y}" width="10" height="${o.pillH}" rx="5" fill="${col}"/>
                        <rect x="40" y="${y}" width="4" height="${o.pillH}" rx="2" fill="white" opacity="0.4"/>
                        <circle cx="78" cy="${y+o.pillH/2}" r="28" fill="#fff" opacity="0.12"/>
                        <circle cx="78" cy="${y+o.pillH/2}" r="25" fill="${col}" opacity="0.22" filter="url(#glow)"/>
                        <circle cx="78" cy="${y+o.pillH/2}" r="20" fill="${col}"/>
                        <text x="78" y="${y+o.pillH/2+7.5}" font-family="Inter,Arial" font-size="20" font-weight="800" fill="white" text-anchor="middle" filter="url(#textDepth)">${o.k}</text>`;
                      const tb = o.lines.length * o.lh,
                            fb = y + (o.pillH - tb) / 2 + o.lh * 0.76;
                      o.lines.forEach((ln, li) =>
                        s += `<text x="122" y="${fb + li * o.lh}" font-family="Inter,Arial" font-size="${L.oF}" fill="${textColor}" opacity="0.97" filter="url(#textDepth)">${esc(ln)}</text>`
                      );
                      s += `</g>`;
                      y += o.pillH + 16;
                    });
                    return s;
                  })()}
                  <rect x="44" y="${L.th-16}" width="562" height="9" rx="4.5" fill="url(#g)" opacity="0.92"/>
                  <rect x="46" y="${L.th-14}" width="558" height="2.5" rx="1.25" fill="white" opacity="0.7"/>
                </g>
              </svg>`;
            },

            // 4: NEON GLOW
            () => {
              return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${style.g1}"/>
                    <stop offset="100%" stop-color="${style.g2}"/>
                  </linearGradient>
                  <filter id="s">
                    <feDropShadow dx="0" dy="20" stdDeviation="${shadow}" flood-opacity="0.4"/>
                  </filter>
                  <filter id="neon">
                    <feGaussianBlur stdDeviation="7" result="blur"/>
                    <feMerge>
                      <feMergeNode in="blur"/>
                      <feMergeNode in="blur"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                  <filter id="glowPill">
                    <feGaussianBlur stdDeviation="9" result="b"/>
                    <feMerge>
                      <feMergeNode in="b"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                </defs>
                <g opacity="0.1">${roadDecor}</g>
                <g transform="translate(35,${top})">
                  <rect width="650" height="${L.th}" rx="${cardR}" fill="${cardFill}" stroke="${style.dark?'#2DD4BF':'#0F172A'}" stroke-width="3" filter="url(#s)"/>
                  <rect width="650" height="${L.th}" rx="${cardR}" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.5" filter="url(#neon)"/>
                  <rect x="0" y="0" width="650" height="${L.th}" rx="${cardR}" fill="url(#g)" opacity="0.06"/>
                  <g filter="url(#neon)">
                    <rect x="40" y="-28" width="160" height="56" rx="28" fill="url(#g)" stroke="white" stroke-width="2.5"/>
                    <text x="120" y="10" font-family="Arial" font-size="27" font-weight="800" fill="white" text-anchor="middle">Q${esc(num)}</text>
                  </g>
                  ${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Arial" font-size="${L.qF}" font-weight="700" fill="${textColor}" filter="url(#neon)">${esc(l)}</text>`).join('')}
                  ${(() => {
                    let y = 90 + L.qH + 30, s = '';
                    L.od.forEach((o,i) => {
                      const col = style.opts[i%4];
                      s += `<g filter="url(#glowPill)">
                        <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR}" fill="${style.dark?'#111827':'#FFFFFF'}" stroke="${col}" stroke-width="3" opacity="0.95"/>
                        <circle cx="76" cy="${y+o.pillH/2}" r="24" fill="${col}"/>
                        <text x="76" y="${y+o.pillH/2+7}" font-family="Arial" font-size="20" font-weight="800" fill="white" text-anchor="middle">${o.k}</text>`;
                      const tb = o.lines.length * o.lh,
                            fb = y + (o.pillH - tb) / 2 + o.lh * 0.75;
                      o.lines.forEach((ln, li) =>
                        s += `<text x="118" y="${fb + li * o.lh}" font-family="Arial" font-size="${L.oF}" fill="${textColor}" filter="url(#neon)">${esc(ln)}</text>`
                      );
                      s += `</g>`;
                      y += o.pillH + 16;
                    });
                    return s;
                  })()}
                </g>
              </svg>`;
            },

            // 5: BOLD CONTRAST
            () => {
              return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${style.g1}"/>
                    <stop offset="100%" stop-color="${style.g2}"/>
                  </linearGradient>
                  <filter id="s">
                    <feDropShadow dx="0" dy="24" stdDeviation="${shadow}" flood-opacity="0.35"/>
                  </filter>
                  <pattern id="stripes" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                    <rect width="12" height="12" fill="none"/>
                    <line x1="0" y1="0" x2="0" y2="12" stroke="${style.dark?'#FFFFFF':'#000000'}" stroke-width="2.5" stroke-opacity="0.08"/>
                  </pattern>
                </defs>
                <g opacity="0.15">${roadDecor}</g>
                <g transform="translate(35,${top})">
                  <rect width="650" height="${L.th}" rx="${cardR}" fill="${cardFill}" filter="url(#s)"/>
                  <rect width="650" height="${L.th}" rx="${cardR}" fill="url(#stripes)"/>
                  <rect x="40" y="-28" width="160" height="56" rx="10" fill="url(#g)" stroke="${textColor}" stroke-width="3"/>
