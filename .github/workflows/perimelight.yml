name: Generate Quiz Video

on:
  workflow_dispatch:
    inputs:
      q: { description: 'Question text', required: true, type: string }
      a: { description: 'Option A', required: true, type: string }
      b: { description: 'Option B', required: true, type: string }
      c: { description: 'Option C', required: false, type: string, default: '' }
      d: { description: 'Option D', required: false, type: string, default: '' }
      x: { description: 'Question number/ID', required: true, type: string }

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install FFmpeg and Sharp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate video
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_X: ${{ github.event.inputs.x }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'),
                  path = require('path'),
                  { execSync } = require('child_process'),
                  sharp = require('sharp');

            const OUT   = 'perimelight/output';
            const TMP   = 'perimelight/temp';
            const MUSIC = 'perimelight/song';
            const SIGNS = 'perimelight/signs';
            [OUT, TMP].forEach(d => fs.mkdirSync(d, { recursive: true }));

            const q = {
              id: process.env.INPUT_X || '1',
              text: process.env.INPUT_Q || '',
              opts: {
                a: process.env.INPUT_A,
                b: process.env.INPUT_B,
                c: process.env.INPUT_C,
                d: process.env.INPUT_D
              }
            };
            const num = parseInt(q.id) || 1;

            // ---------- image detection ----------
            let hasImage = /\[image\]/i.test(q.text);
            if (hasImage) q.text = q.text.replace(/\[image\]/i, '').trim();

            const exts = ['.jpg', '.jpeg', '.png', '.webp'];
            let signPath = null;
            for (const e of exts) {
              const p = path.join(SIGNS, `${num}${e}`);
              if (fs.existsSync(p)) { signPath = p; break; }
            }

            let imageBuf = null, imageW = 0, imageH = 0;
            if (hasImage && signPath) {
              try {
                imageBuf = await sharp(signPath)
                  .resize(540, 320, { fit: 'inside', withoutEnlargement: true })
                  .png()
                  .toBuffer();
                const meta = await sharp(imageBuf).metadata();
                imageW = meta.width;
                imageH = meta.height;
              } catch (e) {
                console.log('[IMAGE] Failed to load:', e.message);
                imageBuf = null;
              }
            }
            const imageHeight = imageBuf ? imageH + 24 : 0;

            // ---------- helpers ----------
            const escXml  = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const escTS   = s => String(s).replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
            const esc     = s => escTS(escXml(s));

            function lightenColor(hex, factor = 0.8) {
              const r = parseInt(hex.slice(1,3),16),
                    g = parseInt(hex.slice(3,5),16),
                    b = parseInt(hex.slice(5,7),16);
              const mix = (c) => Math.round(c + (255 - c) * factor);
              return '#' + [mix(r), mix(g), mix(b)].map(v => v.toString(16).padStart(2,'0')).join('');
            }

            // ---------- STYLES ----------
            const STYLES = [
              { n:'red',     g1:'#FF003D', g2:'#FF4D6D', card:'#FFD1DA', opts:['#FF9100','#00E676','#2979FF','#D500F9'] },
              { n:'orange',  g1:'#FF6A00', g2:'#FF9500', card:'#FFE0BF', opts:['#FF1744','#00C2FF','#7C4DFF','#FFD600'] },
              { n:'violet',  g1:'#7A00FF', g2:'#B026FF', card:'#E8CCFF', opts:['#FF6D00','#00E676','#00C2FF','#FFEA00'] },
              { n:'blue',    g1:'#005DFF', g2:'#3D8BFF', card:'#D4E3FF', opts:['#FF6D00','#00E676','#D500F9','#FFD600'] },
              { n:'green',   g1:'#00C93C', g2:'#00F076', card:'#CCFFE0', opts:['#FF3D00','#00C2FF','#7A00FF','#FFD600'] },
              { n:'yellow',  g1:'#FFD500', g2:'#FFF000', card:'#FFF3B8', opts:['#FF3D00','#00D5FF','#7C00FF','#FF4081'] },
              { n:'purple',  g1:'#8A00D4', g2:'#D000FF', card:'#F0CCFF', opts:['#FF6A00','#00E676','#2979FF','#FFD600'] },
              { n:'magneta', g1:'#FF0099', g2:'#FF33CC', card:'#FFD1F0', opts:['#00E676','#FF9100','#2962FF','#FFF000'] },
              { n:'aqua',    g1:'#00D9FF', g2:'#00FFF0', card:'#CCFAFF', opts:['#FF3D00','#7A00FF','#FFD600','#00E676'] },
              { n:'pink',    g1:'#FF2D75', g2:'#FF66B2', card:'#FFD6E8', opts:['#00C2FF','#76FF03','#7A00FF','#FF9500'] }
            ];

            const style = STYLES[Math.floor(Math.random() * STYLES.length)];
            style.dark = false; // force light theme

            const pillR  = 18 + Math.floor(Math.random() * 10);
            const cardR  = 32 + Math.floor(Math.random() * 12);
            const shadow = 18 + Math.floor(Math.random() * 10);

            const textColor   = '#0F172A';
            const cardFill    = style.card;
            const optionBg    = lightenColor(style.card, 0.8);
            const cardStroke  = 'rgba(15,23,42,0.09)';
            const optionStroke = 'rgba(15,23,42,0.12)';

            // ---------- text wrapping ----------
            function estimateWidth(t, fs) { return t.length * fs * 0.56; }
            function wrapText(text, maxW, fs) {
              const words = String(text).trim().split(/\s+/);
              const lines = [];
              let current = '';
              for (const w of words) {
                const trial = current ? current + ' ' + w : w;
                if (estimateWidth(trial, fs) <= maxW) { current = trial; continue; }
                if (current) lines.push(current);
                if (estimateWidth(w, fs) > maxW) {
                  let part = '';
                  for (const ch of w) {
                    if (estimateWidth(part + ch, fs) <= maxW) { part += ch; }
                    else { lines.push(part); part = ch; }
                  }
                  current = part;
                } else { current = w; }
              }
              if (current) lines.push(current);
              return lines;
            }

            // ---------- layout (image aware) ----------
            function buildLayout() {
              const opts = ['a','b','c','d'].filter(k => q.opts[k]).map(k => {
                let t = String(q.opts[k]).replace(/^[A-D][\.\)\-:]\s*/i, '').trim();
                if (t && /^[a-z]/.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1);
                return { k: k.toUpperCase(), t };
              });
              const TW = 554, OW = 440;
              let qF = 34, oF = 25;
              for (let i = 0; i < 25; i++) {
                const qL = wrapText(q.text, TW, qF);
                const qH = qL.length * qF * 1.35;
                const od = opts.map(o => {
                  const ls = wrapText(o.t, OW, oF);
                  const lh = oF * 1.26;
                  const ph = Math.max(72, ls.length * lh + 34);
                  return { ...o, lines: ls, lh, pillH: ph };
                });
                const gap = 90 + qH + (imageBuf ? imageHeight + 24 : 30);
                const th = gap + od.reduce((s, o) => s + o.pillH, 0) + Math.max(0, od.length - 1) * 16 + 56;
                if (th <= 1180 && qL.length <= 12 && od.every(o => o.lines.length <= 8))
                  return { qF, oF, qL, qH, od, th, optStartY: gap };
                if (qH > 400 || qL.length > 7) qF = Math.max(20, qF - 1);
                else oF = Math.max(17, oF - 1);
              }
              const qL = wrapText(q.text, TW, 20);
              const qH = qL.length * 20 * 1.35;
              const od = opts.map(o => {
                const ls = wrapText(o.t, OW, 17);
                const lh = 17 * 1.26;
                return { ...o, lines: ls, lh, pillH: Math.max(72, ls.length * lh + 34) };
              });
              const gap = 90 + qH + (imageBuf ? imageHeight + 24 : 30);
              const th = Math.min(1200, gap + od.reduce((s, o) => s + o.pillH, 0) + Math.max(0, od.length - 1) * 16 + 56);
              return { qF: 20, oF: 17, qL, qH, od, optStartY: gap, th };
            }

            const L = buildLayout();
            const top = Math.max(20, Math.round((1280 - L.th) / 2 - 20));
            const imgTopInCard = 90 + L.qH + 24;

            // ---------- road decoration ----------
            const icons = [
              `<g opacity="0.13"><polygon points="30,0 70,0 100,30 100,70 70,100 30,100 0,70 0,30" fill="#DC2626" transform="translate(80,200) scale(0.9)"/><text x="130" y="262" font-size="24" fill="white" font-weight="800" text-anchor="middle">STOP</text></g>`,
              `<g opacity="0.12"><polygon points="50,0 100,87 0,87" fill="#EAB308" stroke="#000" stroke-width="3" transform="translate(550,900) scale(0.9)"/><text x="600" y="965" font-size="22" fill="black" font-weight="800" text-anchor="middle">!</text></g>`,
              `<g opacity="0.14" transform="translate(500,250)"><rect x="0" y="0" width="60" height="140" rx="12" fill="#1F2937"/><circle cx="30" cy="30" r="18" fill="#DC2626"/><circle cx="30" cy="70" r="18" fill="#EAB308"/><circle cx="30" cy="110" r="18" fill="#16A34A"/></g>`,
              `<g opacity="0.13" transform="translate(100,950)"><circle cx="50" cy="50" r="48" fill="white" stroke="#DC2626" stroke-width="8"/><text x="50" y="62" font-size="36" font-weight="800" fill="black" text-anchor="middle">50</text></g>`
            ];
            const roadDecor = icons.sort(() => 0.5 - Math.random()).slice(0, 2).join('');

            // ---------- SVG THEMES (all light, using L.optStartY) ----------
            const THEMES = [
             // 13: ROYAL LAVENDER MAX (maximalist)
                      () => { return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${style.g1}"/><stop offset="100%" stop-color="${style.g2}"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFD700"/><stop offset="50%" stop-color="#FFF8DC"/><stop offset="100%" stop-color="#D4AF37"/></linearGradient><linearGradient id="lavGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="100%" stop-color="#EDE7F6" stop-opacity="0.8"/></linearGradient><radialGradient id="gem1" cx="50%" cy="30%"><stop offset="0%" stop-color="white" stop-opacity="0.95"/><stop offset="40%" stop-color="${style.g1}" stop-opacity="0.85"/><stop offset="100%" stop-color="${style.g1}" stop-opacity="0"/></radialGradient><radialGradient id="gem2" cx="50%" cy="30%"><stop offset="0%" stop-color="white" stop-opacity="0.95"/><stop offset="40%" stop-color="${style.g2}" stop-opacity="0.85"/><stop offset="100%" stop-color="${style.g2}" stop-opacity="0"/></radialGradient><pattern id="damask" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="none"/><path d="M30 0 C40 15 45 25 30 30 C15 25 20 15 30 0 M30 60 C20 45 15 35 30 30 C45 35 40 45 30 60" fill="none" stroke="${style.g1}" stroke-opacity="0.09" stroke-width="1.5"/><circle cx="30" cy="30" r="2" fill="${style.g2}" opacity="0.14"/></pattern><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="${shadow}" flood-opacity="0.45"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="emboss"><feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/><feOffset dx="1" dy="1"/><feComposite in="SourceGraphic" operator="over"/></filter></defs><g opacity="0.05">${roadDecor}</g><g transform="translate(35,${top})"><rect width="650" height="${L.th}" rx="${cardR+16}" fill="${cardFill}" filter="url(#s)"/><rect width="650" height="${L.th}" rx="${cardR+16}" fill="url(#damask)"/><rect width="650" height="${L.th}" rx="${cardR+16}" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.92"/><rect width="642" height="${L.th-8}" x="4" y="4" rx="${cardR+12}" fill="none" stroke="white" stroke-opacity="0.45" stroke-width="1.5"/><rect width="634" height="${L.th-16}" x="8" y="8" rx="${cardR+8}" fill="none" stroke="url(#g)" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8,4"/><path d="M0 55 Q325 86 650 55 L650 76 Q325 107 0 76 Z" fill="url(#gold)" opacity="0.22"/><path d="M0 58 Q325 89 650 58" fill="none" stroke="white" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4,6"/><line x1="30" y1="110" x2="30" y2="${L.th-110}" stroke="url(#g)" stroke-width="1" opacity="0.28" stroke-dasharray="3,5"/><line x1="620" y1="110" x2="620" y2="${L.th-110}" stroke="url(#g)" stroke-width="1" opacity="0.28" stroke-dasharray="3,5"/><g filter="url(#glow)"><circle cx="22" cy="22" r="14" fill="url(#gem1)"/><circle cx="22" cy="22" r="8" fill="url(#gold)" stroke="white" stroke-width="1"/><circle cx="628" cy="22" r="14" fill="url(#gem2)"/><circle cx="628" cy="22" r="8" fill="url(#gold)" stroke="white" stroke-width="1"/><circle cx="22" cy="${L.th-22}" r="14" fill="url(#gem2)"/><circle cx="22" cy="${L.th-22}" r="8" fill="url(#gold)" stroke="white" stroke-width="1"/><circle cx="628" cy="${L.th-22}" r="14" fill="url(#gem1)"/><circle cx="628" cy="${L.th-22}" r="8" fill="url(#gold)" stroke="white" stroke-width="1"/></g><g opacity="0.7"><circle cx="80" cy="38" r="2" fill="${style.g1}"/><circle cx="150" cy="28" r="1.5" fill="${style.g2}"/><circle cx="500" cy="44" r="2" fill="${style.g1}"/><circle cx="580" cy="34" r="1.3" fill="${style.g2}"/><circle cx="102" cy="${L.th-42}" r="1.8" fill="${style.g2}"/><circle cx="548" cy="${L.th-32}" r="2" fill="${style.g1}"/></g><g filter="url(#s)"><rect x="14" y="-48" width="210" height="88" rx="30" fill="black" opacity="0.14"/><rect x="16" y="-46" width="206" height="84" rx="28" fill="url(#gold)"/><rect x="20" y="-42" width="198" height="76" rx="24" fill="url(#g)"/><rect x="20" y="-42" width="198" height="76" rx="24" fill="none" stroke="white" stroke-opacity="0.6" stroke-width="2"/><path d="M60 -20 L80 -36 L100 -20 L120 -36 L140 -20 L140 -8 L60 -8 Z" fill="url(#gold)" stroke="white" stroke-width="1" opacity="0.92"/><circle cx="80" cy="-28" r="3" fill="white"/><circle cx="100" cy="-32" r="3.5" fill="white"/><circle cx="120" cy="-28" r="3" fill="white"/></g><text x="119" y="11" font-family="Georgia,serif" font-size="32" font-weight="900" fill="white" text-anchor="middle" filter="url(#emboss)">Q${esc(num)}</text>${L.qL.map((l,i)=>`<text x="48" y="${88+i*L.qF*1.35}" font-family="Georgia,serif" font-size="${L.qF}" font-weight="700" fill="${textColor}" style="paint-order:stroke" stroke="white" stroke-opacity="0.65" stroke-width="0.6">${esc(l)}</text>`).join('')}${(() => { let y = L.optStartY, s = ''; L.od.forEach((o,i) => { const col = style.opts[i%4]; s += `<g><rect x="36" y="${y-3}" width="578" height="${o.pillH+6}" rx="${pillR+4}" fill="black" opacity="0.12" filter="url(#s)"/><rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR}" fill="#EDE7F6" stroke="url(#gold)" stroke-width="2.2"/><rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR}" fill="url(#lavGrad)" opacity="0.88"/><rect x="44" y="${y+3}" width="562" height="${o.pillH-6}" rx="${pillR-2}" fill="none" stroke="white" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="5,3"/><rect x="40" y="${y}" width="9" height="${o.pillH}" rx="4.5" fill="url(#g)"/><circle cx="78" cy="${y+o.pillH/2}" r="26" fill="url(#gem1)" opacity="0.92" filter="url(#glow)"/><circle cx="78" cy="${y+o.pillH/2}" r="21" fill="${col}" stroke="url(#gold)" stroke-width="2.2"/><text x="78" y="${y+o.pillH/2+7}" font-family="Georgia,serif" font-size="20" font-weight="900" fill="white" text-anchor="middle" style="paint-order:stroke" stroke="black" stroke-opacity="0.28" stroke-width="0.9">${o.k}</text>`; const tb = o.lines.length * o.lh, fb = y + (o.pillH - tb) / 2 + o.lh * 0.75; o.lines.forEach((ln, li) => s += `<text x="120" y="${fb + li * o.lh}" font-family="Georgia,serif" font-size="${L.oF}" fill="${textColor}" font-weight="600">${esc(ln)}</text>`); s += `<circle cx="560" cy="${y+14}" r="2.5" fill="${col}" opacity="0.85"/><circle cx="575" cy="${y+o.pillH-14}" r="2" fill="${style.g1}" opacity="0.75"/><path d="M545 ${y+o.pillH/2-8} L555 ${y+o.pillH/2} L545 ${y+o.pillH/2+8}" fill="none" stroke="${col}" stroke-width="1.6" opacity="0.65"/></g>`; y += o.pillH + 20; }); return s; })()}</g></svg>`; },
              // 10: RETRO ARCADE (light)
              () => {
                return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="${style.g1}"/>
                      <stop offset="100%" stop-color="${style.g2}"/>
                    </linearGradient>
                    <filter id="s">
                      <feDropShadow dx="0" dy="12" stdDeviation="${shadow}" flood-opacity="0.35"/>
                    </filter>
                    <pattern id="arcadeDiag" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                      <rect width="20" height="20" fill="none"/>
                      <line x1="0" y1="0" x2="0" y2="20" stroke="#000" stroke-opacity="0.06" stroke-width="4"/>
                    </pattern>
                    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
                      <rect width="4" height="2" fill="black" opacity="0.08"/>
                    </pattern>
                  </defs>
                  <g opacity="0.12">${roadDecor}</g>
                  <g transform="translate(35,${top})">
                    <rect width="650" height="${L.th}" rx="16" fill="${cardFill}" filter="url(#s)"/>
                    <rect width="650" height="${L.th}" rx="16" fill="url(#arcadeDiag)"/>
                    <rect width="650" height="${L.th}" rx="16" fill="url(#scanlines)"/>
                    <rect x="35" y="-32" width="170" height="58" rx="14" fill="url(#g)" stroke="#000" stroke-width="4"/>
                    <rect x="38" y="-29" width="164" height="52" rx="11" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.5"/>
                    <text x="120" y="9" font-family="'Press Start 2P', monospace" font-size="20" font-weight="900" fill="white" text-anchor="middle">Q${esc(num)}</text>
                    ${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="'Press Start 2P', monospace" font-size="${L.qF}" font-weight="700" fill="${textColor}">${esc(l)}</text>`).join('')}
                    ${(() => {
                      let y = L.optStartY, s = '';
                      L.od.forEach((o,i) => {
                        const col = style.opts[i%4];
                        s += `<g>
                          <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="12" fill="#FFF" stroke="${textColor}" stroke-width="4"/>
                          <circle cx="76" cy="${y+o.pillH/2}" r="25" fill="${col}" stroke="#000" stroke-width="3"/>
                          <text x="76" y="${y+o.pillH/2+7}" font-family="'Press Start 2P', monospace" font-size="16" font-weight="900" fill="white" text-anchor="middle">${o.k}</text>`;
                        const tb = o.lines.length * o.lh,
                              fb = y + (o.pillH - tb) / 2 + o.lh * 0.75;
                        o.lines.forEach((ln, li) =>
                          s += `<text x="118" y="${fb + li * o.lh}" font-family="'Press Start 2P', monospace" font-size="${L.oF}" fill="${textColor}">${esc(ln)}</text>`
                        );
                        s += `</g>`;
                        y += o.pillH + 16;
                      });
                      return s;
                    })()}
                  </g>
                </svg>`;
              },
              // 11: FUTURISTIC HUD (light)
                    () => { return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${style.g1}"/><stop offset="100%" stop-color="${style.g2}"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="${shadow}" flood-opacity="0.35"/></filter><filter id="glowLine"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g opacity="0.08">${roadDecor}</g><g transform="translate(35,${top})"><rect width="650" height="${L.th}" rx="${cardR}" fill="${cardFill}" stroke="#0369A1" stroke-width="2.5" filter="url(#s)"/><path d="M10,40 L10,10 L40,10" fill="none" stroke="url(#g)" stroke-width="2.5" filter="url(#glowLine)"/><path d="M610,10 L640,10 L640,40" fill="none" stroke="url(#g)" stroke-width="2.5" filter="url(#glowLine)"/><path d="M10,${L.th-40} L10,${L.th-10} L40,${L.th-10}" fill="none" stroke="url(#g)" stroke-width="2.5" filter="url(#glowLine)"/><path d="M610,${L.th-10} L640,${L.th-10} L640,${L.th-40}" fill="none" stroke="url(#g)" stroke-width="2.5" filter="url(#glowLine)"/><line x1="0" y1="0" x2="650" y2="0" stroke="url(#g)" stroke-width="2" filter="url(#glowLine)"/><line x1="0" y1="${L.th}" x2="650" y2="${L.th}" stroke="url(#g)" stroke-width="2" filter="url(#glowLine)"/><rect x="30" y="-32" width="180" height="64" rx="6" fill="none" stroke="url(#g)" stroke-width="2.5"/><rect x="34" y="-28" width="172" height="56" rx="4" fill="url(#g)" opacity="0.9"/><text x="120" y="8" font-family="Orbitron, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">Q${esc(num)}</text>${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Orbitron, sans-serif" font-size="${L.qF}" font-weight="700" fill="${textColor}">${esc(l)}</text>`).join('')}${(() => { let y = L.optStartY, s = ''; L.od.forEach((o,i) => { const col = style.opts[i%4]; s += `<g><rect x="40" y="${y}" width="570" height="${o.pillH}" rx="4" fill="${optionBg}" stroke="${col}" stroke-width="2"/><rect x="40" y="${y}" width="8" height="${o.pillH}" rx="2" fill="${col}"/><circle cx="78" cy="${y+o.pillH/2}" r="21" fill="none" stroke="${col}" stroke-width="2.5"/><circle cx="78" cy="${y+o.pillH/2}" r="14" fill="${col}"/><text x="78" y="${y+o.pillH/2+7}" font-family="Orbitron, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">${o.k}</text>`; const tb = o.lines.length * o.lh, fb = y + (o.pillH - tb) / 2 + o.lh * 0.75; o.lines.forEach((ln, li) => s += `<text x="118" y="${fb + li * o.lh}" font-family="Orbitron, sans-serif" font-size="${L.oF}" fill="${textColor}">${esc(ln)}</text>`); s += `</g>`; y += o.pillH + 16; }); return s; })()}<circle cx="670" cy="30" r="8" fill="${style.opts[0]}" filter="url(#glowLine)"/><circle cx="670" cy="60" r="6" fill="${style.opts[1]}" opacity="0.9" filter="url(#glowLine)"/></g></svg>`; },

               // 3: NEON GLOW
               () => { return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${style.g1}"/><stop offset="100%" stop-color="${style.g2}"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="20" stdDeviation="${shadow}" flood-opacity="0.4"/></filter><filter id="neon"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowPill"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g opacity="0.1">${roadDecor}</g><g transform="translate(35,${top})"><rect width="650" height="${L.th}" rx="${cardR}" fill="${cardFill}" stroke="#0F172A" stroke-width="3" filter="url(#s)"/><rect width="650" height="${L.th}" rx="${cardR}" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.5"/><rect x="0" y="0" width="650" height="${L.th}" rx="${cardR}" fill="url(#g)" opacity="0.06"/><g><rect x="40" y="-28" width="160" height="56" rx="28" fill="url(#g)" stroke="white" stroke-width="2.5"/><text x="120" y="10" font-family="Arial" font-size="27" font-weight="800" fill="white" text-anchor="middle">Q${esc(num)}</text></g>${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Arial" font-size="${L.qF}" font-weight="700" fill="${textColor}">${esc(l)}</text>`).join('')}${(() => { let y = L.optStartY, s = ''; L.od.forEach((o,i) => { const col = style.opts[i%4]; s += `<g><rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR}" fill="#FFFFFF" stroke="${col}" stroke-width="3" opacity="0.95"/><circle cx="76" cy="${y+o.pillH/2}" r="24" fill="${col}"/><text x="76" y="${y+o.pillH/2+7}" font-family="Arial" font-size="20" font-weight="800" fill="white" text-anchor="middle">${o.k}</text>`; const tb = o.lines.length * o.lh, fb = y + (o.pillH - tb) / 2 + o.lh * 0.75; o.lines.forEach((ln, li) => s += `<text x="118" y="${fb + li * o.lh}" font-family="Arial" font-size="${L.oF}" fill="${textColor}">${esc(ln)}</text>`); s += `</g>`; y += o.pillH + 16; }); return s; })()}</g></svg>`; },
              // 4: BOLD CONTRAST (tested ultrabox)
              () => {
                return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="${style.g1}"/>
                      <stop offset="100%" stop-color="${style.g2}"/>
                    </linearGradient>
                    <filter id="s">
                      <feDropShadow dx="0" dy="24" stdDeviation="${shadow}" flood-opacity="0.35"/>
                    </filter>
                    <pattern id="stripes" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                      <rect width="12" height="12" fill="none"/>
                      <line x1="0" y1="0" x2="0" y2="12" stroke="#000000" stroke-width="2.5" stroke-opacity="0.08"/>
                    </pattern>
                  </defs>
                  <g opacity="0.15">${roadDecor}</g>
                  <g transform="translate(35,${top})">
                    <rect width="650" height="${L.th}" rx="${cardR}" fill="${cardFill}" filter="url(#s)"/>
                    <rect width="650" height="${L.th}" rx="${cardR}" fill="url(#stripes)"/>
                    <rect x="40" y="-28" width="160" height="56" rx="10" fill="url(#g)" stroke="${textColor}" stroke-width="3"/>
                    <text x="120" y="10" font-family="Arial" font-size="27" font-weight="800" fill="white" text-anchor="middle">Q${esc(num)}</text>
                    ${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Arial" font-size="${L.qF}" font-weight="700" fill="${textColor}">${esc(l)}</text>`).join('')}
                    ${(() => {
                      let y = L.optStartY, s = '';
                      L.od.forEach((o,i) => {
                        const col = style.opts[i%4];
                        s += `<g>
                          <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="0" fill="#F1F5F9" stroke="${col}" stroke-width="3.5"/>
                          <rect x="40" y="${y}" width="16" height="${o.pillH}" fill="${col}"/>
                          <circle cx="78" cy="${y+o.pillH/2}" r="23" fill="${col}"/>
                          <text x="78" y="${y+o.pillH/2+7}" font-family="Arial" font-size="20" font-weight="800" fill="white" text-anchor="middle">${o.k}</text>`;
                        const tb = o.lines.length * o.lh,
                              fb = y + (o.pillH - tb) / 2 + o.lh * 0.75;
                        o.lines.forEach((ln, li) =>
                          s += `<text x="120" y="${fb + li * o.lh}" font-family="Arial" font-size="${L.oF}" fill="${textColor}" font-weight="600">${esc(ln)}</text>`
                        );
                        s += `</g>`;
                        y += o.pillH + 16;
                      });
                      return s;
                    })()}
                  </g>
                </svg>`;
              },
              // 9: BRUTALIST UI (light)
              () => {
                return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="${style.g1}"/>
                      <stop offset="100%" stop-color="${style.g2}"/>
                    </linearGradient>
                    <filter id="s">
                      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-opacity="0.35"/>
                    </filter>
                    <pattern id="concrete" width="40" height="40" patternUnits="userSpaceOnUse">
                      <rect width="40" height="40" fill="#F8FAFC"/>
                      <path d="M0 20 Q10 18 20 20 T40 20" fill="none" stroke="${textColor}" stroke-opacity="0.04" stroke-width="1"/>
                    </pattern>
                  </defs>
                  <g opacity="0.1">${roadDecor}</g>
                  <g transform="translate(35,${top})">
                    <rect width="650" height="${L.th}" rx="0" fill="${cardFill}" stroke="${textColor}" stroke-width="5" filter="url(#s)"/>
                    <rect width="650" height="${L.th}" rx="0" fill="url(#concrete)"/>
                    <rect x="20" y="-38" width="190" height="66" rx="0" fill="url(#g)" stroke="${textColor}" stroke-width="4"/>
                    <text x="115" y="8" font-family="Impact, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle" stroke="${textColor}" stroke-width="1.5">Q${esc(num)}</text>
                    ${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Impact, sans-serif" font-size="${L.qF}" font-weight="800" fill="${textColor}">${esc(l)}</text>`).join('')}
                    ${(() => {
                      let y = L.optStartY, s = '';
                      L.od.forEach((o,i) => {
                        const col = style.opts[i%4];
                        s += `<g>
                          <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="0" fill="#F8FAFC" stroke="${textColor}" stroke-width="4"/>
                          <rect x="40" y="${y}" width="18" height="${o.pillH}" fill="${col}"/>
                          <circle cx="78" cy="${y+o.pillH/2}" r="24" fill="${col}" stroke="${textColor}" stroke-width="3"/>
                          <text x="78" y="${y+o.pillH/2+7}" font-family="Impact, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle" stroke="${textColor}" stroke-width="0.5">${o.k}</text>`;
                        const tb = o.lines.length * o.lh,
                              fb = y + (o.pillH - tb) / 2 + o.lh * 0.75;
                        o.lines.forEach((ln, li) =>
                          s += `<text x="120" y="${fb + li * o.lh}" font-family="Arial" font-size="${L.oF}" fill="${textColor}" font-weight="600">${esc(ln)}</text>`
                        );
                        s += `</g>`;
                        y += o.pillH + 16;
                      });
                      return s;
                    })()}
                  </g>
                </svg>`;
              }
            ];

            // ---------- fallback background ----------
            async function generateFallbackBg() {
              const bgSvg = `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${style.g1}" stop-opacity="0.15"/>
                    <stop offset="50%" stop-color="${style.g2}" stop-opacity="0.08"/>
                    <stop offset="100%" stop-color="${style.g1}" stop-opacity="0.12"/>
                  </linearGradient>
                  <filter id="blurBg"><feGaussianBlur stdDeviation="40"/></filter>
                  <filter id="glass">
                    <feGaussianBlur stdDeviation="10" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                  </filter>
                </defs>
                <rect width="720" height="1280" fill="${cardFill}"/>
                <rect width="720" height="1280" fill="url(#bgGrad)" filter="url(#blurBg)"/>
                <rect width="720" height="1280" fill="white" opacity="0.08" filter="url(#glass)"/>
              </svg>`;
              return await sharp(Buffer.from(bgSvg)).png().toBuffer();
            }

            // ---------- main generation ----------
            let bgBuffer;
            try {
              const randomId = Math.floor(Math.random() * 1084);
              const response = await fetch(`https://picsum.photos/id/${randomId}/1200/2000`);
              if (!response.ok || !response.headers.get('content-type')?.startsWith('image/')) {
                throw new Error('Invalid image response');
              }
              const imgArrayBuf = await response.arrayBuffer();
              bgBuffer = await sharp(Buffer.from(imgArrayBuf))
                .resize(720, 1280, { fit: 'cover' })
                .blur(14 + Math.floor(Math.random() * 8))
                .modulate({ brightness: 0.6 + Math.random() * 0.12, saturation: 1 + Math.random() * 0.2 })
                .toBuffer();
            } catch (e) {
              console.warn('Background fetch failed, using gradient fallback:', e.message);
              bgBuffer = await generateFallbackBg();
            }

            const themeFn = THEMES[Math.floor(Math.random() * THEMES.length)];
            const svg = themeFn();
            const overlay = await sharp(Buffer.from(svg)).png().toBuffer();

            let frame = path.join(TMP, `frame_${Date.now()}.png`);
            await sharp(bgBuffer)
              .composite([{ input: overlay }])
              .png()
              .toFile(frame);

            // ----- composite the sign image if available -----
            if (imageBuf) {
              const imgLeft = 35 + Math.round((650 - imageW) / 2);
              const imgTop  = Math.round(top + imgTopInCard);
              const frameWithImg = path.join(TMP, `frame_img_${Date.now()}.png`);
              await sharp(frame)
                .composite([{ input: imageBuf, left: imgLeft, top: imgTop }])
                .png()
                .toFile(frameWithImg);
              fs.renameSync(frameWithImg, frame);
            }

            // ----- audio -----
            let audio = null;
            if (fs.existsSync(MUSIC)) {
              const files = fs.readdirSync(MUSIC).filter(x => /\.(mp3|m4a|wav)$/i.test(x));
              if (files.length) audio = path.join(MUSIC, files[Math.floor(Math.random() * files.length)]);
            }

            // ----- ffmpeg -----
            const DUR = (4.9 + Math.random() * 0.6).toFixed(2);
            const CRF = 21 + Math.floor(Math.random() * 4);
            const hue = (Math.random() * 20 - 10).toFixed(1);
            const vf = `zoompan=z='min(zoom+0.0012,${(1 + Math.random() * 0.025).toFixed(3)})':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=720x1280:fps=30,eq=brightness=${(Math.random() * 0.04 - 0.02).toFixed(3)}:saturation=${(1 + Math.random() * 0.1).toFixed(2)},hue=h=${hue},noise=alls=${2 + Math.floor(Math.random() * 3)}:allf=t+u,vignette=${(0.2 + Math.random() * 0.15).toFixed(2)},format=yuv420p`;

            const safeId = q.id.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(OUT, `quiz_${safeId}_${Date.now()}.mp4`);
            const args = [
              '-y', '-loglevel', 'error', '-loop', '1', '-i', frame
            ];
            if (audio) args.push('-i', audio);
            args.push('-t', DUR, '-vf', vf, '-r', '30', '-c:v', 'libx264', '-crf', String(CRF), '-preset', 'veryfast');
            if (audio) args.push('-c:a', 'aac', '-b:a', '128k', '-shortest');
            else args.push('-an');
            args.push('-movflags', '+faststart', outFile);

            execSync(`ffmpeg ${args.map(a => `"${a.replace(/"/g, '\\"')}"`).join(' ')}`);

            console.log(`Generated: ${outFile}   theme: ${style.n}   image: ${imageBuf ? 'yes' : 'no'}`);
          })();
          NODESCRIPT

      - name: Commit and push video
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/output/
          git diff --staged --quiet || (git commit -m "Add quiz video" && git push)
