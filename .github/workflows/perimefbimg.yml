name: Generate Quiz Image for facebook

on:
  workflow_dispatch:
    inputs:
      q: { description: 'Question text', required: true, type: string }
      a: { description: 'Option A', required: true, type: string }
      b: { description: 'Option B', required: true, type: string }
      c: { description: 'Option C', required: false, type: string, default: '' }
      d: { description: 'Option D', required: false, type: string, default: '' }
      x: { description: 'Question number/ID', required: true, type: string }

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Sharp (no FFmpeg needed)
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_X: ${{ github.event.inputs.x }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'),
                  path = require('path'),
                  sharp = require('sharp');

            // Output settings
            const W = 1080, H = 1350;              // 4:5 Facebook feed portrait
            const OUT_DIR = 'perimelight/outputfbimg';
            const SIGNS_DIR = 'perimelight/signs';
            fs.mkdirSync(OUT_DIR, { recursive: true });

            // Parse inputs
            const q = {
              id: process.env.INPUT_X || '1',
              text: process.env.INPUT_Q || '',
              opts: {
                a: process.env.INPUT_A,
                b: process.env.INPUT_B,
                c: process.env.INPUT_C,
                d: process.env.INPUT_D
              }
            };

            // Clean up question text (remove [image] tag)
            let hasImage = /\[image\]/i.test(q.text);
            if (hasImage) q.text = q.text.replace(/\[image\]/i, '').trim();

            // Try to load an image from signs folder
            const exts = ['.jpg', '.jpeg', '.png', '.webp'];
            let signPath = null;
            for (const e of exts) {
              const p = path.join(SIGNS_DIR, `${q.id}${e}`);
              if (fs.existsSync(p)) { signPath = p; break; }
            }

            let imageBuf = null, imageW = 0, imageH = 0;
            if (hasImage && signPath) {
              try {
                // Resize image to fit within 80% of width
                const maxImgWidth = Math.floor(W * 0.8);
                imageBuf = await sharp(signPath)
                  .resize(maxImgWidth, Math.floor(H * 0.35), { fit: 'inside', withoutEnlargement: true })
                  .png()
                  .toBuffer();
                const meta = await sharp(imageBuf).metadata();
                imageW = meta.width;
                imageH = meta.height;
              } catch (e) {
                console.log('[IMAGE] Failed to load:', e.message);
                imageBuf = null;
              }
            }

            // ----- Text wrapping helper -----
            function estimateWidth(t, fontSize) { return t.length * fontSize * 0.56; }
            function wrapText(text, maxWidth, fontSize) {
              const words = String(text).trim().split(/\s+/);
              const lines = [];
              let current = '';
              for (const w of words) {
                const trial = current ? current + ' ' + w : w;
                if (estimateWidth(trial, fontSize) <= maxWidth) { current = trial; continue; }
                if (current) lines.push(current);
                if (estimateWidth(w, fontSize) > maxWidth) {
                  let part = '';
                  for (const ch of w) {
                    if (estimateWidth(part + ch, fontSize) <= maxWidth) { part += ch; }
                    else { lines.push(part); part = ch; }
                  }
                  current = part;
                } else { current = w; }
              }
              if (current) lines.push(current);
              return lines;
            }

            // ----- Layout calculation (adaptive fonts) -----
            const opts = ['a','b','c','d'].filter(k => q.opts[k]).map(k => {
              let t = String(q.opts[k]).replace(/^[A-D][\.\)\-:]\s*/i, '').trim();
              if (t && /^[a-z]/.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1);
              return { k: k.toUpperCase(), t };
            });

            const Q_MAX_W = Math.floor(W * 0.78);
            const O_MAX_W = Math.floor(W * 0.58);
            let qFont = 42, oFont = 32;
            let L = null;

            for (let i = 0; i < 30; i++) {
              const qLines = wrapText(q.text, Q_MAX_W, qFont);
              const qHeight = qLines.length * qFont * 1.35;
              const od = opts.map(o => {
                const ls = wrapText(o.t, O_MAX_W, oFont);
                const lh = oFont * 1.26;
                const ph = Math.max(80, ls.length * lh + 44);
                return { ...o, lines: ls, lh, pillH: ph };
              });
              const totalH = 80 + qHeight + (imageBuf ? imageH + 30 : 30) + od.reduce((s,o) => s + o.pillH, 0) + (od.length - 1) * 24 + 80;
              if (totalH <= H - 40 && qLines.length <= 10 && od.every(o => o.lines.length <= 6)) {
                L = { qFont, oFont, qLines, qHeight, od, totalH };
                break;
              }
              if (qHeight > 500 || qLines.length > 8) qFont = Math.max(24, qFont - 1);
              else oFont = Math.max(20, oFont - 1);
            }
            if (!L) {
              // Fallback
              const qLines = wrapText(q.text, Q_MAX_W, 24);
              const od = opts.map(o => {
                const ls = wrapText(o.t, O_MAX_W, 20);
                return { ...o, lines: ls, lh: 20*1.26, pillH: Math.max(80, ls.length * 20*1.26 + 44) };
              });
              L = {
                qFont: 24, oFont: 20,
                qLines, qHeight: qLines.length * 24 * 1.35,
                od,
                totalH: 160 + qLines.length * 24 * 1.35 + (imageBuf ? imageH + 30 : 30) + od.reduce((s,o)=>s+o.pillH,0) + (od.length-1)*24
              };
            }

            const topY = Math.max(20, Math.round((H - L.totalH) / 2));
            const imgTopY = topY + 80 + L.qHeight + 24;  // position below question text

            // ----- SVG overlay (dark theme, simple) -----
            const svgParts = [];
            svgParts.push(`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`);

            // Question badge
            svgParts.push(`
              <g transform="translate(90, ${topY - 38})">
                <rect x="0" y="0" width="180" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.12"/>
                <text x="90" y="36" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q${q.id}</text>
              </g>
            `);

            // Question text
            L.qLines.forEach((line, i) => {
              const y = topY + 50 + i * L.qFont * 1.35;
              svgParts.push(`<text x="90" y="${y}" font-family="Arial, sans-serif" font-size="${L.qFont}" font-weight="600" fill="#FFFFFF">${escapeXml(line)}</text>`);
            });

            // Options
            let optY = topY + 80 + L.qHeight + 24;
            if (imageBuf) optY += imageH + 24;

            L.od.forEach((o, i) => {
              const pillY = optY;
              const pillH = o.pillH;
              // Pill background
              svgParts.push(`<rect x="90" y="${pillY}" width="${W - 180}" height="${pillH}" rx="20" fill="#1F2937" stroke="#374151" stroke-width="2"/>`);
              // Accent letter circle
              const circleCx = 120;
              const circleCy = pillY + pillH/2;
              svgParts.push(`<circle cx="${circleCx}" cy="${circleCy}" r="28" fill="#374151"/>`);
              svgParts.push(`<text x="${circleCx}" y="${circleCy + 10}" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">${o.k}</text>`);

              // Option text lines
              const textBlockY = pillY + (pillH - o.lines.length * o.lh) / 2 + o.lh * 0.8;
              o.lines.forEach((line, li) => {
                svgParts.push(`<text x="170" y="${textBlockY + li * o.lh}" font-family="Arial, sans-serif" font-size="${L.oFont}" fill="#E5E7EB">${escapeXml(line)}</text>`);
              });

              optY += pillH + 24;
            });

            svgParts.push('</svg>');
            const svgString = svgParts.join('\n');

            // ----- Compose final image -----
            // Dark background (solid)
            const bgBuffer = await sharp({
              create: {
                width: W,
                height: H,
                channels: 3,
                background: { r: 17, g: 24, b: 39 }   // #111827, deep dark
              }
            }).png().toBuffer();

            const overlay = await sharp(Buffer.from(svgString)).png().toBuffer();

            let composite = [{ input: overlay }];
            if (imageBuf) {
              const imgX = Math.round((W - imageW) / 2);
              composite.push({ input: imageBuf, left: imgX, top: imgTopY });
            }

            const safeId = q.id.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);

            await sharp(bgBuffer)
              .composite(composite)
              .png()
              .toFile(outFile);

            console.log(`Image created: ${outFile}`);
          })();

          // Minimal XML escape
          function escapeXml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image" && git push)
