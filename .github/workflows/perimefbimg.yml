name: Generate Quiz Image for facebook

on:
  workflow_dispatch:
    inputs:
      q: { description: 'Question text', required: true, type: string }
      a: { description: 'Option A', required: true, type: string }
      b: { description: 'Option B', required: true, type: string }
      c: { description: 'Option C', required: false, type: string, default: '' }
      d: { description: 'Option D', required: false, type: string, default: '' }
      x: { description: 'Question number/ID', required: true, type: string }
      brand: { description: 'Brand / username watermark', required: false, type: string, default: 'perime.rw250' }

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Sharp
        run: npm install sharp --no-fund --no-audit --loglevel=error

      - name: Generate Quiz Image
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_X: ${{ github.event.inputs.x }}
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          node --input-type=commonjs - <<'NODESCRIPT'
          (async () => {
            const fs = require('fs'), path = require('path'), sharp = require('sharp');

            // ── CONSTANTS ──────────────────────────────────────────────────────
            const W = 1080, H = 1350;
            const OUT_DIR  = 'perimelight/outputfbimg';
            const SIGNS_DIR = 'perimelight/signs';
            fs.mkdirSync(OUT_DIR, { recursive: true });

            const PAD_X   = 56;
            const CARD_X  = PAD_X - 16;       // 40px from edge
            const CARD_W  = W - CARD_X * 2;   // 1000px wide
            const Q_MAX_W = CARD_W - 44;       // question text area
            const O_MAX_W = CARD_W - 114;      // option text area (after badge)
            const HEADER_H = 168, FOOTER_H = 168;
            const IMG_GAP = 24, OPT_GAP = 14;

            // ── INPUTS ─────────────────────────────────────────────────────────
            const qId   = (process.env.INPUT_X || '1').trim();
            const brand = (process.env.INPUT_BRAND || 'perime.rw250').replace(/^@/, '').trim();
            let   qText = (process.env.INPUT_Q || '').replace(/\r?\n/g, ' ').replace(/\s+/g, ' ').trim();
            const rawOpts = {
              a: (process.env.INPUT_A || '').trim(),
              b: (process.env.INPUT_B || '').trim(),
              c: (process.env.INPUT_C || '').trim(),
              d: (process.env.INPUT_D || '').trim()
            };

            // ── SIGN IMAGE ──────────────────────────────────────────────────────
            const hasImg = /\[image\]/i.test(qText);
            if (hasImg) qText = qText.replace(/\[image\]/i, '').trim();

            let signBuf = null, signW = 0, signH = 0;
            if (hasImg) {
              for (const ext of ['.jpg', '.jpeg', '.png', '.webp']) {
                const p = path.join(SIGNS_DIR, `${qId}${ext}`);
                if (!fs.existsSync(p)) continue;
                try {
                  signBuf = await sharp(p)
                    .resize(Math.floor(W * 0.80), 400, { fit: 'inside', withoutEnlargement: true })
                    .png().toBuffer();
                  const m = await sharp(signBuf).metadata();
                  signW = m.width; signH = m.height;
                } catch (e) { console.warn('[sign]', e.message); signBuf = null; }
                break;
              }
            }

            // ── OPTIONS ─────────────────────────────────────────────────────────
            const OPT_CFG = {
              A: { circle: '#FF453A', bg: '#FF453A' },
              B: { circle: '#0A84FF', bg: '#0A84FF' },
              C: { circle: '#FFD60A', bg: '#FFD60A' },
              D: { circle: '#30D158', bg: '#30D158' }
            };
            const opts = ['a', 'b', 'c', 'd']
              .filter(k => rawOpts[k])
              .map(k => {
                const K = k.toUpperCase();
                let t = String(rawOpts[k]).replace(/^[A-D][\.\)\-:\s]+/i, '').trim();
                if (t && /^[a-z]/.test(t)) t = t[0].toUpperCase() + t.slice(1);
                return { k: K, t, cfg: OPT_CFG[K] };
              });

            // ── TEXT UTILITIES ───────────────────────────────────────────────────
            function charWidth(ch) {
              if (/[iIl1|!.,;:'`"()\[\]{}\\\/]/.test(ch)) return 0.34;
              if (/[mwMW@%]/.test(ch))                     return 0.72;
              if (/[A-Z]/.test(ch))                        return 0.66;
              if (/[a-z]/.test(ch))                        return 0.52;
              if (/[0-9]/.test(ch))                        return 0.58;
              return 0.56;
            }
            function textWidth(str, fs) {
              return [...String(str)].reduce((s, c) => s + charWidth(c) * fs, 0);
            }
            function wrapText(text, maxW, fs) {
              const words = String(text).trim().split(/\s+/);
              const lines = []; let cur = '';
              for (const w of words) {
                const trial = cur ? cur + ' ' + w : w;
                if (textWidth(trial, fs) <= maxW) { cur = trial; continue; }
                if (cur) lines.push(cur);
                if (textWidth(w, fs) > maxW) {
                  let part = '';
                  for (const ch of w) {
                    if (textWidth(part + ch, fs) <= maxW) part += ch;
                    else { lines.push(part); part = ch; }
                  }
                  cur = part;
                } else cur = w;
              }
              if (cur) lines.push(cur);
              return lines;
            }

            // ── LAYOUT ──────────────────────────────────────────────────────────
            let qFont = 54, oFont = 38, L = null;

            for (let iter = 0; iter < 40; iter++) {
              const qLines = wrapText(qText, Q_MAX_W, qFont);
              const qLH    = qFont * 1.38;
              const qCardH = qLines.length * qLH + 88;
              const od = opts.map(o => {
                const lines = wrapText(o.t, O_MAX_W, oFont);
                const lh    = oFont * 1.32;
                const pillH = Math.max(90, lines.length * lh + 48);
                return { ...o, lines, lh, pillH };
              });
              const signBlock = signBuf ? signH + IMG_GAP * 2 : IMG_GAP;
              const optsH     = od.reduce((s, o) => s + o.pillH, 0) + (od.length - 1) * OPT_GAP;
              const totalH    = HEADER_H + qCardH + signBlock + optsH + FOOTER_H;

              if (totalH <= H - 20 && qLines.length <= 6 && od.every(o => o.lines.length <= 3)) {
                L = { qFont, oFont, qLines, qLH, qCardH, od, signBlock, optsH, totalH };
                break;
              }
              if      (qLines.length > 4 && qFont > 34)               qFont -= 2;
              else if (od.some(o => o.lines.length > 2) && oFont > 26) oFont -= 1;
              else if (totalH > H - 20 && qFont > 34)                  qFont -= 2;
              else if (oFont > 26)                                      oFont -= 1;
              else break;
            }

            if (!L) { // hard fallback
              const qLines = wrapText(qText, Q_MAX_W, 34);
              const od = opts.map(o => {
                const lines = wrapText(o.t, O_MAX_W, 28);
                return { ...o, lines, lh: 28 * 1.32, pillH: Math.max(90, lines.length * 28 * 1.32 + 48) };
              });
              const signBlock = signBuf ? signH + IMG_GAP * 2 : IMG_GAP;
              const optsH = od.reduce((s, o) => s + o.pillH, 0) + (od.length - 1) * OPT_GAP;
              L = { qFont: 34, oFont: 28, qLines, qLH: 34 * 1.38, qCardH: qLines.length * 34 * 1.38 + 88,
                    od, signBlock, optsH, totalH: H };
            }

            // Vertical positions — content block centered
            const vSlack     = Math.max(0, H - L.totalH);
            let   cur        = Math.round(vSlack / 2);
            const headerY    = cur; cur += HEADER_H;
            const qCardY     = cur; cur += L.qCardH;
            const signTopY   = cur + IMG_GAP;  cur += L.signBlock;
            const optsStartY = cur;            cur += L.optsH;
            const footerY    = cur;

            // ── LAYER 1: BACKGROUND SVG (fully opaque) ───────────────────────────
            const BG_SVG = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stop-color="#1C0540"/>
                  <stop offset="50%"  stop-color="#130128"/>
                  <stop offset="100%" stop-color="#090112"/>
                </linearGradient>
                <radialGradient id="g1" cx="88%" cy="8%"   r="52%">
                  <stop offset="0%"   stop-color="#9333EA" stop-opacity="0.45"/>
                  <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="g2" cx="12%" cy="85%"  r="50%">
                  <stop offset="0%"   stop-color="#6D28D9" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="g3" cx="55%" cy="100%" r="42%">
                  <stop offset="0%"   stop-color="#DB2777" stop-opacity="0.28"/>
                  <stop offset="100%" stop-color="#DB2777" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <rect width="${W}" height="${H}" fill="url(#bg)"/>
              <rect width="${W}" height="${H}" fill="url(#g1)"/>
              <rect width="${W}" height="${H}" fill="url(#g2)"/>
              <rect width="${W}" height="${H}" fill="url(#g3)"/>
              <circle cx="${W + 90}" cy="-90"     r="380" fill="none" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="8 14" opacity="0.22"/>
              <circle cx="${W + 90}" cy="-90"     r="290" fill="none" stroke="#A855F7" stroke-width="1"   opacity="0.16"/>
              <circle cx="-90"      cy="${H + 90}" r="350" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 14" opacity="0.20"/>
              <circle cx="-90"      cy="${H + 90}" r="260" fill="none" stroke="#DB2777" stroke-width="1"   opacity="0.15"/>
              <circle cx="105"  cy="88"    r="2.5" fill="#fff" opacity="0.30"/>
              <circle cx="286"  cy="55"    r="1.5" fill="#fff" opacity="0.22"/>
              <circle cx="532"  cy="41"    r="2"   fill="#fff" opacity="0.28"/>
              <circle cx="756"  cy="96"    r="1.5" fill="#fff" opacity="0.20"/>
              <circle cx="948"  cy="66"    r="2.5" fill="#fff" opacity="0.32"/>
              <circle cx="186"  cy="214"   r="1.5" fill="#fff" opacity="0.18"/>
              <circle cx="894"  cy="182"   r="2"   fill="#fff" opacity="0.24"/>
              <circle cx="1036" cy="330"   r="1.5" fill="#fff" opacity="0.20"/>
              <circle cx="70"   cy="1220"  r="2"   fill="#fff" opacity="0.22"/>
              <circle cx="279"  cy="1284"  r="1.5" fill="#fff" opacity="0.18"/>
              <circle cx="519"  cy="1308"  r="2.5" fill="#fff" opacity="0.28"/>
              <circle cx="816"  cy="1256"  r="1.5" fill="#fff" opacity="0.20"/>
              <circle cx="990"  cy="1282"  r="2"   fill="#fff" opacity="0.24"/>
              <circle cx="152"  cy="1048"  r="1.5" fill="#fff" opacity="0.15"/>
              <circle cx="718"  cy="1154"  r="1.5" fill="#fff" opacity="0.18"/>
            </svg>`;

            // ── LAYER 3: CONTENT SVG (transparent background) ───────────────────
            // Sign image (layer 2) composited separately — this SVG has no bg rect,
            // so the sign shows through the transparent gap between card and options.
            const C = [];
            C.push(`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`);
            C.push(`<defs>
              <linearGradient id="brandGr" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="#9333EA"/>
                <stop offset="100%" stop-color="#EC4899"/>
              </linearGradient>
              <linearGradient id="cardGr" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#F3EEFF"/>
              </linearGradient>
              <filter id="fCard" x="-8%" y="-8%" width="116%" height="116%">
                <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
              </filter>
              <filter id="fPill" x="-5%" y="-10%" width="110%" height="120%">
                <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
              </filter>
              <filter id="fBadge" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#9333EA" flood-opacity="0.85"/>
              </filter>
            </defs>`);

            // Header: brand label left, @handle right
            const hTY = headerY + 58;
            C.push(`<text x="${PAD_X}" y="${hTY}" font-family="Arial Black,Arial,sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" opacity="0.92" letter-spacing="2">TRIVIA TIME</text>`);
            C.push(`<text x="${W - PAD_X}" y="${hTY}" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.85" text-anchor="end">@${escapeXml(brand)}</text>`);

            // Question number badge
            const BW = 216, BH = 52, BX = (W - BW) / 2, BY = headerY + 86;
            C.push(`<rect x="${BX}" y="${BY}" width="${BW}" height="${BH}" rx="${BH / 2}" fill="url(#brandGr)" filter="url(#fBadge)"/>`);
            C.push(`<text x="${W / 2}" y="${BY + BH / 2 + 11}" font-family="Arial Black,Arial,sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">QUESTION  #${escapeXml(qId)}</text>`);

            // Question card
            C.push(`<rect x="${CARD_X}" y="${qCardY}" width="${CARD_W}" height="${L.qCardH}" rx="26" fill="url(#cardGr)" filter="url(#fCard)"/>`);
            C.push(`<rect x="${CARD_X}" y="${qCardY + 22}" width="9" height="${L.qCardH - 44}" rx="4.5" fill="url(#brandGr)"/>`);
            const qTX  = CARD_X + 36;
            const qTY0 = qCardY + 44 + L.qFont * 0.82;
            L.qLines.forEach((line, i) => {
              C.push(`<text x="${qTX}" y="${qTY0 + i * L.qLH}" font-family="Arial,sans-serif" font-size="${L.qFont}" font-weight="800" fill="#1A0E2E">${escapeXml(line)}</text>`);
            });

            // Options
            let oY = optsStartY;
            L.od.forEach(o => {
              const { k, lines, lh, pillH, cfg } = o;
              C.push(`<rect x="${CARD_X}" y="${oY}" width="${CARD_W}" height="${pillH}" rx="22" fill="${cfg.bg}" fill-opacity="0.20" stroke="${cfg.bg}" stroke-opacity="0.45" stroke-width="1.5" filter="url(#fPill)"/>`);
              const cx = CARD_X + 54, cy = oY + pillH / 2;
              C.push(`<circle cx="${cx}" cy="${cy}" r="34" fill="${cfg.circle}"/>`);
              C.push(`<text x="${cx}" y="${cy + 11}" font-family="Arial Black,Arial,sans-serif" font-size="27" font-weight="900" fill="#FFFFFF" text-anchor="middle">${k}</text>`);
              const tX  = CARD_X + 104;
              const tY0 = oY + (pillH - lines.length * lh) / 2 + lh * 0.82;
              lines.forEach((line, li) => {
                C.push(`<text x="${tX}" y="${tY0 + li * lh}" font-family="Arial,sans-serif" font-size="${L.oFont}" font-weight="700" fill="#FFFFFF">${escapeXml(line)}</text>`);
              });
              oY += pillH + OPT_GAP;
            });

            // Footer
            const ftCy = footerY + 52;
            C.push(`<text x="${W / 2}" y="${ftCy}" font-family="Arial Black,Arial,sans-serif" font-size="33" font-weight="900" fill="#FFD60A" text-anchor="middle" letter-spacing="1">COMMENT YOUR ANSWER!</text>`);

            const fCols = ['#FF453A', '#0A84FF', '#FFD60A', '#30D158'];
            const fLets = opts.map(o => o.k);
            const fSpc  = 108, fLX0 = W / 2 - (fLets.length - 1) * fSpc / 2;
            fLets.forEach((lt, i) => {
              const lx = fLX0 + i * fSpc;
              C.push(`<circle cx="${lx}" cy="${ftCy + 62}" r="36" fill="${fCols[i] || '#9333EA'}"/>`);
              C.push(`<text x="${lx}" y="${ftCy + 62 + 12}" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">${lt}</text>`);
            });
            C.push(`<text x="${W / 2}" y="${ftCy + 122}" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Follow @${escapeXml(brand)} for daily trivia</text>`);

            // Bottom gradient accent bar
            C.push(`<rect x="${PAD_X * 2}" y="${H - 38}" width="${W - PAD_X * 4}" height="4" rx="2" fill="url(#brandGr)" opacity="0.55"/>`);

            C.push('</svg>');

            // ── COMPOSITE: bg → sign image → content ────────────────────────────
            const bgBuf   = await sharp(Buffer.from(BG_SVG)).png().toBuffer();
            const contBuf = await sharp(Buffer.from(C.join('\n'))).png().toBuffer();

            const layers = [];
            if (signBuf) {
              layers.push({ input: signBuf, left: Math.round((W - signW) / 2), top: Math.round(signTopY) });
            }
            layers.push({ input: contBuf, top: 0, left: 0 });

            const safeId  = qId.replace(/[^a-z0-9]/gi, '_');
            const outFile = path.join(OUT_DIR, `quiz_${safeId}_${Date.now()}.png`);
            await sharp(bgBuf).composite(layers).png({ compressionLevel: 8 }).toFile(outFile);
            console.log(`Generated: ${outFile}`);
          })();

          function escapeXml(s) {
            return String(s)
              .replace(/&/g, '&amp;').replace(/</g, '&lt;')
              .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
          }
          NODESCRIPT

      - name: Commit and push image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add perimelight/outputfbimg/
          git diff --staged --quiet || (git commit -m "Add quiz image Q${{ github.event.inputs.x }}" && git push)
